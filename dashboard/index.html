<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Dashboard</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --surface: #fff; --text: #1d2330; --muted: #5d6675; --border: #d9dde4; --accent: #3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --surface: #1c2027; --text: #e7eaf0; --muted: #9aa3b2; --border: #2e3440; --accent: #7b93f5; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.app { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; font-weight: 600; }
  a.app:hover, a.app:focus-visible { border-color: var(--accent); outline: none; }
  a.app span { font-weight: 400; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Test Dashboard</h1>
  <p>Pick an app. Inside a dashboard, switch apps from the menu at the top left.</p>
  <div id="apps"></div>
</main>
<script>
// Kept in step with apps.json (a page opened from disk cannot read a .json file, so the list is repeated here).
const APPS = [
  { id: 'egenome', name: 'eGenome.ai', href: '../apps/egenome/reports/index.html' },
  { id: 'instagram', name: 'Instagram', href: '../apps/instagram/reports/index.html' },
];
let last = null;
try { last = localStorage.getItem('dash.lastApp'); } catch {}
document.getElementById('apps').innerHTML = APPS.map((a) => `<a class="app" href="${a.href}">${a.name}<span>${a.id === last ? 'last opened' : 'open'}</span></a>`).join('');
</script>
</body>
</html>
