    const apiRows = Object.entries((run.metrics && run.metrics.api) || {}).sort((a, b2) => (b2[1].p95 || 0) - (a[1].p95 || 0));
    return `<section class="card" style="margin-bottom:12px"><div class="card-h"><h2>Budgets and trends</h2><div class="r">limits in test/budgets.json · over budget = warning, never a failure</div></div>
      <div class="card-b">
        <p style="margin:0 0 8px">${over ? `<b style="color:var(--warn-text)">${over} over budget</b>` : '<b style="color:var(--good)">Everything within budget</b>'} · ${slower ? `<b style="color:var(--warn-text)">${slower} slower than usual</b>` : b.trends.length ? 'nothing slower than usual' : 'trends: not enough earlier passing runs on this device yet (3 needed)'} · response formats: ${fChecked} checked${fProb ? `, <b style="color:var(--critical)">${fProb} with problems</b>` : ''}${fNot ? `, ${fNot} could not be checked` : ''}
          <span class="muted"> · usual = median of earlier passing ${esc(b.deviceKey)}</span></p>
        <div class="seg" role="group" aria-label="Show budgets" style="margin-bottom:6px">${seg2('problems', 'Needs a look', rows.filter((r) => r.rank < 2).length)}${seg2('all', 'All', rows.length)}</div>
        <div class="tbl-wrap"><table class="budgets"><thead><tr><th>What</th><th class="hide-sm">Measure</th><th class="num">This run</th><th class="num">Budget</th><th class="num hide-sm">Usual</th><th class="hide-sm">Status</th><th class="hide-sm">Last ${runs.length} runs</th></tr></thead><tbody>
        ${show.length ? show.map(({ x, t, st }) => `<tr><td style="min-width:180px;word-break:break-word"><div class="${x.area === 'api' ? 'mono' : ''}" style="font-size:12.5px;overflow-wrap:anywhere">${esc(shortName(x))}</div><div class="show-sm" style="margin:3px 0">${chipSt(st[0], '', st[1])} <span class="muted">${esc(x.metric)}</span></div><div class="sub">${esc(x.text)}${t ? ' ' + esc(t.text) : ''}${x.known ? ' Known API: ' + esc(x.known) : ''}</div></td>
          <td class="hide-sm">${esc(x.metric)}</td><td class="num">${fmtV(x.value, x.unit)}</td><td class="num">${x.limit == null ? '<span class="muted">not set</span>' : fmtV(x.limit, x.unit)}</td><td class="num hide-sm">${t ? fmtV(t.baseline, t.unit) + `<div class="sub">${t.pct > 0 ? '+' : ''}${t.pct}%</div>` : '<span class="muted">—</span>'}</td>
          <td class="hide-sm">${chipSt(st[0], '', st[1])}</td><td class="hide-sm">${spark(seriesOf(x.key, runs), x.unit, x.limit, shortName(x) + ' ' + x.metric)}</td></tr>`).join('') : `<tr><td colspan="7" class="muted">Nothing over budget or slower than usual in this run. Choose "All" to see every budget.</td></tr>`}</tbody></table></div>
      </div></section>
      <!--tab key=api|label=API times and formats--><section class="card" style="margin-bottom:12px"><div class="card-h"><h2>API response times</h2><div class="r">time to the response headers · p50 = half the calls were faster · p95 = 95 in 100 were faster</div></div><div class="card-b tbl-wrap">${apiRows.length ? `<table><thead><tr><th>API</th><th class="num">Calls</th><th class="num">p50</th><th class="num">p95</th><th class="num hide-sm">Max</th><th class="num">p95 budget</th><th class="hide-sm">p95 over the last ${runs.length} runs</th></tr></thead><tbody>
        ${apiRows.map(([ep, a]) => { const it = b.items.find((x) => x.key === 'api|' + ep + '|p95') || {}; return `<tr><td class="mono" style="word-break:break-all;min-width:200px">${esc(ep.replace(/^\S+ /, ''))}${it.known ? ' <span class="muted" style="font-family:inherit">(known API)</span>' : ''}</td><td class="num">${a.n}</td><td class="num">${fmtV(a.p50, 'ms')}</td><td class="num" style="${it.ok === false && !it.known ? 'color:var(--warn-text);font-weight:600' : ''}">${fmtV(a.p95, 'ms')}</td><td class="num hide-sm">${fmtV(a.max, 'ms')}</td><td class="num">${fmtV(it.limit, 'ms')}</td><td class="hide-sm">${spark(seriesOf('api|' + ep + '|p95', runs), 'ms', it.limit, ep + ' p95')}</td></tr>`; }).join('')}</tbody></table>` : `<p class="empty">No API calls with a response time in this run.</p>`}</div></section>
      <section class="card" style="margin-bottom:12px"><div class="card-h"><h2>Response formats</h2><div class="r">fields the app relies on, from test/api-formats.json</div></div><div class="card-b tbl-wrap">${b.formats.length ? `<table class="formats"><thead><tr><th>API</th><th class="num">OK</th><th class="num">Problems</th><th class="num">Not checked</th><th>Details</th></tr></thead><tbody>
        ${b.formats.map((f) => `<tr><td>${esc(f.rule)}<div class="sub mono">${esc(f.endpoint.replace(/^\S+ /, ''))}</div></td><td class="num">${f.ok}</td><td class="num" style="${f.problems ? 'color:var(--critical);font-weight:700' : ''}">${f.problems}</td><td class="num">${f.notChecked}</td><td style="font-size:12.5px">${f.problems ? f.examples.map((e) => `<div style="color:var(--critical)">✖ ${esc(e)}</div>`).join('') : ''}${f.notChecked ? f.reasons.map((e) => `<div class="muted">◌ ${esc(e)}</div>`).join('') : ''}${!f.problems && !f.notChecked ? '<span style="color:var(--good)">✓ every checked field was there with the right type</span>' : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="empty" style="padding:8px">No API in this run has a rule in test/api-formats.json, or no API was called.</p>'}</div></section>`;
  }

  function perfHtml() {
    if (!current) return '<p class="empty">No runs.</p>';
    const at = runsF.indexOf(current);
    const runs = runsF.slice(at, at + 14).reverse();
    const cur = current.perf || {}, prev = (runsF[at + 1] || {}).perf || {};
    const card = (label, v, pv, unit, hint) => `<div class="card card-b"><div class="muted">${label}</div><div style="font-size:24px;font-weight:700">${v == null ? '—' : v + unit}</div>
      <div class="d ${v != null && pv != null && v !== pv ? (v > pv ? 'bad' : 'good') : ''}" style="font-size:12px">${v != null && pv != null ? (v === pv ? '= last run' : (v > pv ? '▲ ' : '▼ ') + Math.round(Math.abs(v - pv) * 10) / 10 + unit + ' vs last') : esc(hint)}</div></div>`;
    const run = (window.DASH_RUNS || {})[current.id];
    if (!run) { loadRun(current.id).then(() => { if (S.tab === 'performance') render(); }); }
    const rowsP = run ? run.tests.filter((t) => t.perf) : [];
    return tabify(`<div class="page"><h1>Performance</h1>
      <!--tab key=budgets|label=Budgets and trends-->${budgetHtml(current, runs)}
      <!--tab key=charts|label=Charts per run--><div class="cards3">
        ${card('App start (cold launch)', cur.launchMs, prev.launchMs, ' ms', 'from Android\'s "Displayed" log line')}
        ${card('Peak memory (PSS)', cur.memoryMaxMb, prev.memoryMaxMb, ' MB', 'after each test')}
        ${card('Janky frames', cur.jankyPct, prev.jankyPct, '%', cur.frames ? cur.frames + ' frames' : 'needs adb_shell (DASHBOARD_PERF)')}
      </div>
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
        <section class="card"><div class="card-h"><h2>App start · ms</h2></div><div class="card-b">${lineChart(runs, (r) => r.perf?.launchMs ?? null, ' ms', 'var(--accent)', 'App start time per run')}</div></section>
        <section class="card"><div class="card-h"><h2>Peak memory · MB</h2></div><div class="card-b">${lineChart(runs, (r) => r.perf?.memoryMaxMb ?? null, ' MB', 'var(--accent)', 'Peak memory per run')}</div></section>
        <section class="card"><div class="card-h"><h2>Janky frames · %</h2></div><div class="card-b">${lineChart(runs, (r) => r.perf?.jankyPct ?? null, '%', 'var(--warn)', 'Janky frames per run')}</div></section>
      </div>
      <!--tab key=pertest|label=Per test|badge=${rowsP.length}--><section class="card"><div class="card-h"><h2>Per test · run ${esc(current.id)}</h2></div><div class="card-b tbl-wrap">${rowsP.length ? `<table><thead><tr><th>Test</th><th class="num">Memory</th><th class="num">Frames</th><th class="num">Janky</th><th class="num">90th pct frame</th><th>Launches seen</th><th class="num">Time</th></tr></thead><tbody>
        ${rowsP.map((t) => `<tr class="row" data-open="t:${esc(t.id && t.id !== 'SESSION' ? t.id : t.title)}"><td>${esc(t.title)}</td><td class="num">${t.perf.memoryPssKb ? Math.round(t.perf.memoryPssKb / 1024) + ' MB' : '—'}</td><td class="num">${t.perf.frames?.total ?? '—'}</td><td class="num">${t.perf.frames?.jankyPct != null ? t.perf.frames.jankyPct + '%' : '—'}</td><td class="num">${t.perf.frames?.p90Ms != null ? t.perf.frames.p90Ms + ' ms' : '—'}</td><td>${(t.perf.launches || []).map((l) => esc(l.activity + ' ' + l.ms + ' ms')).join(', ') || '—'}</td><td class="num">${dur(t.durationMs)}</td></tr>`).join('')}</tbody></table>`
        : '<p class="empty">No performance data in this run. It is collected from runs made with the new recorder (memory and launch time always; frame stats when Appium allows adb_shell, which the config turns on unless DASHBOARD_PERF=off).</p>'}</div></section><!--/tabs--></div>`, 'budgets', 'Performance page');
  }

  function devicesHtml() {
    const runs = runsFiltered('platform');
    const osList = [...new Set(runs.map((r) => r.device?.platformVersion || '?'))].sort((a, b) => parseFloat(b) - parseFloat(a));
    const devList = [...new Set(runs.map((r) => r.device?.deviceModel || r.device?.deviceName || 'unknown'))].sort();
    const cell = (os, dv) => {
      const rs = runs.filter((r) => (r.device?.platformVersion || '?') === os && (r.device?.deviceModel || r.device?.deviceName || 'unknown') === dv);
      if (!rs.length) return '<td class="muted" style="text-align:center">—</td>';
      const tot = rs.reduce((n, r) => n + r.summary.total, 0), ok = rs.reduce((n, r) => n + r.summary.total - r.summary.failed, 0);
      const p = pct(ok, tot);
      const plat = devName(rs[0].device);
      return `<td class="cell ${p >= 95 ? 'g' : p >= 80 ? 'a' : 'b'}" data-platform="${esc(plat)}" data-tip="${esc(plat + ' · ' + rs.length + ' run(s) · ' + ok + '/' + tot + ' tests passed')}">${p}%<div style="font-weight:400;font-size:11px">${rs.length} run${rs.length > 1 ? 's' : ''}</div></td>`;
    };
    return `<div class="page"><h1>Device matrix</h1>
      <p class="muted">Pass rate of all tests per Android version and device, over the kept runs that match the other filters. Click a cell to filter the whole dashboard to that platform. ≥95% green, 80–95% amber, below 80% red.</p>
      <section class="card"><div class="card-b tbl-wrap"><table class="heat"><thead><tr><th>Android ↓ / Device →</th>${devList.map((d) => `<th>${esc(d)}</th>`).join('')}</tr></thead>
      <tbody>${osList.map((os) => `<tr><th>Android ${esc(os)}</th>${devList.map((d) => cell(os, d)).join('')}</tr>`).join('')}</tbody></table></div></section>
      <p class="muted" style="font-size:12px">One emulator so far? Add devices/AVDs (e.g. Android 12 and 15) and run the suites on each to fill the matrix.</p></div>`;
  }

  function historyHtml() {
    const ids = new Set(runsF.map((r) => r.id));
    const list = idx.tests.map((T) => {
      const res = T.results.filter((x) => ids.has(x.runId));
      if (!res.length) return null;
      const f = (x) => x.status === 'failed';
      let flips = 0; for (let i = 1; i < res.length; i++) if (f(res[i]) !== f(res[i - 1])) flips++;
      const fails = res.filter(f).length;
      const lastFail = res.find(f);
      return { T, res, fails, flakiness: res.length > 1 ? Math.round((flips / (res.length - 1)) * 100) : 0, lastFail, avg: res.reduce((n, x) => n + (x.durationMs || 0), 0) / res.length };
    }).filter(Boolean).sort((a, b) => b.flakiness - a.flakiness || b.fails - a.fails || a.T.name.localeCompare(b.T.name, undefined, { numeric: true }));
    return `<div class="page"><h1>History</h1>
      <p class="muted">Every test over the kept runs (newest square on the left). <b>Flakiness</b> = how often the result flips between pass and fail from one run to the next: 0% is stable, high means unreliable. Click a square to open that run's result.</p>
      <section class="card"><div class="card-b tbl-wrap"><table><thead><tr><th>Test</th><th>Module</th><th>Results</th><th class="num">Pass</th><th class="num">Flakiness</th><th>Last failure</th><th class="num">Avg time</th></tr></thead><tbody>
      ${list.map((x) => `<tr><td><b>${esc(x.T.title)}</b></td><td>${esc(x.T.module)}</td>
        <td><div class="dots">${x.res.slice(0, 25).map((r) => `<a class="dot ${r.status}" href="#" data-goto-test="${esc(r.runId)}|t:${esc(x.T.name)}" data-tip="${esc(r.runId + ' · ' + r.status + (r.version ? ' · v' + r.version : '') + ' · ' + dur(r.durationMs))}" aria-label="${esc(r.runId + ' ' + r.status)}"></a>`).join('')}</div></td>
        <td class="num">${pct(x.res.length - x.fails, x.res.length)}%</td>
        <td class="num">${x.flakiness ? chipSt('FLAKY', '', x.flakiness + '%') : '<span class="muted">0%</span>'}</td>
        <td>${x.lastFail ? `<a href="#" data-goto-test="${esc(x.lastFail.runId)}|t:${esc(x.T.name)}">${esc(x.lastFail.runId)}</a>` : '<span class="muted">never</span>'}</td>
        <td class="num">${dur(x.avg)}</td></tr>`).join('')}</tbody></table></div></section></div>`;
  }

    $$('[data-platform]').forEach((el) => el.onclick = () => setState({ platform: el.dataset.platform }));
    $$('tr[data-open]').forEach((tr) => tr.onclick = () => setState({ tab: 'triage', f: 'all', open: tr.dataset.open, t: '' }));
    $$('tbody tr.row[data-key]').forEach((tr) => tr.onclick = (e) => { if (e.target.closest('a,button')) return; selIndex = +tr.dataset.i; setState({ open: tr.dataset.key, t: '' }); });
    $$('[data-ticket]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); setState({ open: b.dataset.ticket, t: '' }); setTimeout(() => { const l = $('#a-link'); if (l) l.focus(); }, 250); });
    const dl = $('#dl-triage'); if (dl) dl.onclick = downloadTriage;

  }
  // global filter bar
  $('#s-app').onchange = (e) => (APPS ? openApp(e.target.value) : setState({ app: e.target.value, run: '', open: '' }));

  $('#s-platform').onchange = (e) => setState({ platform: e.target.value, run: '', open: '' });
  $('#s-suite').onchange = (e) => setState({ suite: e.target.value, run: '', open: '' });
  $('#mine').onclick = () => { if (!S.mine && !whoAmI()) return; setState({ mine: !S.mine }); };
  $('#q').oninput = (e) => { clearTimeout(e.target._t); e.target._t = setTimeout(() => { selIndex = 0; setState({ q: e.target.value }, { replace: true }); }, 200); };
  $('#refresh').onclick = () => refresh(true);
  $('#scrim').onclick = () => closeDrawer();
  $$('.tabs a').forEach((a) => a.onclick = (e) => { e.preventDefault(); setState({ tab: a.dataset.tab, open: '', t: '' }); });
  $('#fToggle').onclick = () => { const on = document.body.classList.toggle('filters-open'); $('#fToggle').setAttribute('aria-expanded', String(on)); };

  // keyboard: j/k move, Enter open, Esc close, / search, r refresh
  addEventListener('keydown', (e) => {
    if (lbOpen() && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { $(e.key === 'ArrowLeft' ? '.p' : '.nx', lb.el).click(); return; }
    if (e.key === 'Escape') { if (lbOpen()) { closeLb(); return; } if (document.body.classList.contains('drawer-open')) { closeDrawer(); return; } }
    if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
    if (e.key === 'r') { refresh(true); return; }
    if (S.tab !== 'triage' || !rows.length) return;
    if (e.key === 'j' || e.key === 'k') {
      selIndex = Math.max(0, Math.min(rows.length - 1, selIndex + (e.key === 'j' ? 1 : -1)));
      $$('tbody tr.row[data-key]').forEach((tr) => { const on = +tr.dataset.i === selIndex; tr.classList.toggle('sel', on); tr.setAttribute('aria-selected', String(on)); if (on) tr.scrollIntoView({ block: 'nearest' }); });

    if (e.key === 'Enter' && rows[selIndex]) setState({ open: rows[selIndex].g.key, t: '' });

  // lightbox + tooltips
  // Screenshot viewer: one screen, or every step's screen of a test (← →), with layout-check boxes when there are any
  const lb = { el: $('#lb'), list: [], i: 0 };
  const lbOpen = () => lb.el.classList.contains('open');
  function renderOverlay(it) {
    const ov = $('.ov', lb.el), tools = $('.tools', lb.el);
    ov.innerHTML = '';
    const els = (it && it.layout) || [];
    tools.hidden = !els.length;
    if (!els.length) return;
    const all = $('#allBoxes').checked;
    const box = (b, cls, label) => (b ? `<i class="${cls}" style="left:${b.x * 100}%;top:${b.y * 100}%;width:${b.w * 100}%;height:${b.h * 100}%">${label ? `<span>${esc(label)}</span>` : ''}</i>` : '');
    ov.innerHTML = els.filter((e) => all || e.status !== 'passed').map((e) => (e.status !== 'passed' && e.expected ? box(e.expected, 'exp', '') : '') + box(e.actual, `act-${e.status}`, e.status !== 'passed' ? e.name : '')).join('');
  }
  function renderLb() {
    const it = lb.list[lb.i]; if (!it) return;
    $('img', lb.el).src = it.src;
    renderOverlay(it);
    $('.cap .t', lb.el).innerHTML = `${it.status ? statusIcon(it.status) + ' ' : ''}${esc(it.title || '')}`;
    $('.cap .s', lb.el).textContent = `${it.sub || ''}${lb.list.length > 1 ? `  ·  ${lb.i + 1} / ${lb.list.length}` : ''}`;
    $('.p', lb.el).hidden = $('.nx', lb.el).hidden = lb.list.length < 2;
  }
  const openLb = (list, i = 0) => { lb.list = typeof list === 'string' ? [{ src: list, title: 'Screen' }] : list; lb.i = i; renderLb(); lb.el.classList.add('open'); };
  const closeLb = () => { lb.el.classList.remove('open'); if (pending) { pending = false; refresh(false); } };
  $('#allBoxes').addEventListener('change', () => renderOverlay(lb.list[lb.i]));
  $('.x', lb.el).onclick = closeLb;
  $('.p', lb.el).onclick = () => { lb.i = (lb.i - 1 + lb.list.length) % lb.list.length; renderLb(); };
  $('.nx', lb.el).onclick = () => { lb.i = (lb.i + 1) % lb.list.length; renderLb(); };
  lb.el.addEventListener('click', (e) => { if (e.target === lb.el) closeLb(); });
  const tip = $('#tip');
  document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (!el) { tip.style.display = 'none'; return; } tip.textContent = el.dataset.tip; tip.style.display = 'block'; });
  document.addEventListener('mousemove', (e) => { if (tip.style.display === 'block') { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = e.clientY + 14 + 'px'; } });
  const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 4500); };

  // ---------------------------------------------------------------- auto-refresh (data/latest.js changes after every test and at the end of a run)
  const auto = $('#auto');
  auto.checked = store.get('egDashAuto', true);
  const setLive = () => $('#autoWrap').classList.toggle('off', !auto.checked);
  auto.onchange = () => { store.set('egDashAuto', auto.checked); setLive(); };
  setLive();
  let pending = false;
  async function refresh(manual) {
    const before = idx && idx.runs[0];
    window.DASH_UNIT = null; // reloaded when the Unit tests tab shows
    await loadIndex();
    if (current) await loadRun(current.id, true);
    const now = idx.runs[0];
    const y = scrollY, dy = $('.db') ? $('.db').scrollTop : 0;
    const focusId = document.activeElement && document.activeElement.id;
    render();
    scrollTo(0, y);
    setTimeout(() => { const db = $('.db'); if (db) db.scrollTop = dy; }, 0);
    if (focusId && $('#' + focusId) && focusId === 'q') $('#q').focus();
    if (now && (!before || before.id !== now.id)) toast('New run started: ' + now.id + (S.run ? ' (you are viewing ' + S.run + ')' : ''));
    else if (now && before && before.status === 'running' && now.status !== 'running') toast('Run ' + now.id + ' finished');
    else if (manual) toast('Refreshed');
    else if (now) toast('Updated: ' + now.summary.total + ' test(s) in run ' + now.id);
  }
  setInterval(async () => {
    if (!auto.checked || !idx) return;
    window.DASH_LATEST = null;
    await loadScript('data/latest.js');
    const L = window.DASH_LATEST;
    if (!L || L.generatedAt === idx.generatedAt) return;
    const busy = lbOpen() || (document.activeElement && document.activeElement.closest && document.activeElement.closest('#drawer input'));
    if (busy) { pending = true; return; } // don't swap things the developer is looking at or typing in
    refresh(false);
  }, 3000);

  loadIndex().then(render);
})();
</script>
