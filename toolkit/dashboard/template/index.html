<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eGenome.ai App Tests</title>
<!--
  Test dashboard. Layout, top to bottom = most urgent first:
    1 sticky filter bar   App · Build · Run · Env · Platform · Only mine · search · refresh  (state lives in the URL)
    2 verdict + KPIs       PASS / UNSTABLE / BLOCKED, numbers with change since the previous run (click = filter)
    3 two charts           failures by module (sorted) · trend over the last 14 runs
    4 triage table         grouped by error signature; sorted severity -> new -> module
    5 detail drawer        error, steps to reproduce, screenshot/video, device/build, logs, diff vs last pass, actions
  Secondary tabs: Coverage · Performance · Device matrix · History.
  Keyboard: j / k move, Enter opens, Esc closes, / search, r refresh.
  Data: data/*.js written by test/support/report/dashboard.mjs. Edit this file (template/index.html), not reports/index.html.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974; --accent: #2a78d6;
  --good: #0ca30c; --critical: #d03b3b; --skipped: #8f8e88; --running: #2a78d6;
  --good-bg: rgba(12,163,12,.10); --crit-bg: rgba(208,59,59,.09); --skip-bg: rgba(122,121,116,.13); --run-bg: rgba(42,120,214,.12);
  --warn-bg: rgba(250,178,25,.18); --warn-text: #8a5a00; --warn: #e0a100;
  --code-bg: #f0efec; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03); --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86; --accent: #3987e5; --running: #3987e5;
    --good-bg: rgba(12,163,12,.16); --crit-bg: rgba(208,59,59,.18); --skip-bg: rgba(163,162,157,.14); --run-bg: rgba(57,135,229,.16);
    --code-bg: #242422; --shadow: none; --warn-text: #fab219; --warn: #fab219;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86; --accent: #3987e5; --running: #3987e5;
  --good-bg: rgba(12,163,12,.16); --crit-bg: rgba(208,59,59,.18); --skip-bg: rgba(163,162,157,.14); --run-bg: rgba(57,135,229,.16);
  --code-bg: #242422; --shadow: none; --warn-text: #fab219; --warn: #fab219;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); font-size: 12px; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 1. Sticky filter bar + tabs */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; color: var(--text); margin-right: 6px; white-space: nowrap; }
.brand:hover { text-decoration: none; }
/* Several apps share this dashboard: the logo and name at the top left follow the app picked in the App filter */
.applogo { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; object-fit: cover; }
.f { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 8px; padding: 0 0 0 8px; background: var(--surface); min-height: 32px; }
.f span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.f select { border: 0; background-color: var(--surface); color: var(--text); padding: 5px 4px; width: auto; max-width: 150px; cursor: pointer; }
/* The open list is drawn by Windows/Chrome: give the options their own solid colours, or they can come out
   light-on-light (or dark-on-dark) and only the selected one is readable. */
select option, select optgroup { background-color: var(--surface); color: var(--text); }
select option:checked { background-color: var(--accent); color: #fff; }
.f.on select { background-color: transparent; }
.f.on select option { background-color: var(--surface); }
.f.on { border-color: var(--accent); background: var(--run-bg); }
.toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; min-height: 32px; cursor: pointer; background: var(--surface); }
.toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--run-bg); color: var(--accent); font-weight: 600; }
.search { flex: 1 1 180px; min-width: 150px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-height: 32px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.right-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.auto { font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
.auto.off .dot-live { background: var(--skipped); }
.tabs { display: flex; gap: 2px; overflow-x: auto; align-items: center; border-bottom: 1px solid var(--border); padding-top: 4px; }
.tabs a { padding: 7px 12px; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs a:hover { text-decoration: none; color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); font-weight: 650; }
.tabs .hint { color: var(--muted); font-size: 12px; padding: 7px 0; white-space: nowrap; }

/* 2. Verdict + KPI strip */
.verdict { display: flex; align-items: stretch; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.vbox { display: flex; flex-direction: column; justify-content: center; padding: 10px 16px; border-radius: var(--radius); min-width: 210px; color: #fff; }
.vbox.PASS { background: var(--good); } .vbox.UNSTABLE { background: var(--warn); color: #1d1500; } .vbox.BLOCKED { background: var(--critical); } .vbox.NONE { background: var(--skipped); }
.vbox .v { font-size: 22px; font-weight: 750; letter-spacing: .02em; display: flex; gap: 8px; align-items: center; }
.vbox .why { font-size: 12px; opacity: .92; max-width: 260px; }
.vbox .run { font-size: 11.5px; opacity: .9; margin-top: 2px; font-family: var(--mono); }
.vlink { background: none; border: 0; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 2px 0 0; font-size: 12px; text-align: left; opacity: .95; }
.kpis { display: grid; grid-template-columns: repeat(8, minmax(92px, 1fr)); gap: 8px; flex: 1 1 680px; }
@media (max-width: 1250px) { .kpis { grid-template-columns: repeat(4, minmax(92px, 1fr)); } }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
.kpi { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 8px 12px; text-align: left; cursor: pointer; border-top: 3px solid var(--c, var(--border)); }
.kpi:hover { background: var(--surface-2); }
.kpi[aria-pressed="true"] { outline: 2px solid var(--c, var(--accent)); }
.kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kpi .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.d.bad { color: var(--critical); font-weight: 600; } .d.good { color: var(--good); font-weight: 600; }
.kpi.alert { background: var(--crit-bg); }

/* Consolidated band (all runs) */
.cons { margin: 0 0 12px; padding: 10px 14px 12px; }
.cons .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; gap: 10px; flex-wrap: wrap; }
.cons .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 8px; }
.tile { border: 1px solid var(--border); border-top: 3px solid var(--c); border-radius: 8px; padding: 7px 10px; background: var(--surface); text-align: left; cursor: pointer; }
.tile:hover { background: var(--surface-2); }
.tile .top-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.tile .n { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .n small { font-size: 12px; font-weight: 400; color: var(--muted); }
.tile .s { font-size: 11.5px; color: var(--text-2); display: flex; justify-content: space-between; gap: 6px; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 3px; }
.tile.alert { background: var(--crit-bg); border-color: var(--critical); }
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-2); margin-top: 10px; }
.sbar i { display: block; height: 100%; }

/* API calls */
.calls { display: flex; flex-direction: column; }
details.call { border-bottom: 1px solid var(--border); }
details.call:last-child { border-bottom: 0; }
details.call > summary { display: grid; grid-template-columns: 86px 40px minmax(0, 1fr) 70px 64px 64px; gap: 8px; align-items: center; padding: 6px 4px; cursor: pointer; list-style: none; font-size: 12.5px; color: var(--text); margin: 0; }
details.call > summary::-webkit-details-marker { display: none; }
details.call > summary:hover { background: var(--surface-2); }
details.call.fail > summary { box-shadow: inset 3px 0 var(--critical); }
details.call.warn > summary { box-shadow: inset 3px 0 var(--warn); }
details.call .ep { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
details.call .why { grid-column: 3 / -1; font-size: 12px; margin-top: -2px; }
details.call .why.fail { color: var(--critical); font-weight: 600; } details.call .why.warn { color: var(--warn-text); } details.call .why.known { color: var(--text-2); }
details.call .cd { padding: 6px 10px 12px 20px; font-size: 12.5px; }
/* Phone: after the desktop call rules above, so it wins */
@media (max-width: 900px) { details.call > summary { grid-template-columns: minmax(0, 1fr) auto auto; } details.call > summary .hide-sm { display: none; } details.call > summary .why, details.call > summary .res { grid-column: 1 / -1; min-width: 0; overflow-wrap: anywhere; } details.call > summary > * { min-width: 0; } details.call > summary .num { white-space: nowrap; } details.call .cd { padding: 6px 4px 12px 8px; } }
.http { font-family: var(--mono); font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; text-align: center; }
.http.s2 { background: var(--good-bg); color: var(--good); } .http.s3 { background: var(--run-bg); color: var(--accent); } .http.s4, .http.s5, .http.sx { background: var(--critical); color: #fff; } .http.known { background: var(--skip-bg); color: var(--text-2); }
.callsum { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
.callsum > *, .cards3 > * { min-width: 0; overflow-wrap: anywhere; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; flex-wrap: wrap; }
.card-h h2 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }
.card-h .r { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card-b { padding: 8px 14px 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 12px; margin-bottom: 12px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.legend { display: flex; gap: 12px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }

/* 3. Charts */
.mbars { display: flex; flex-direction: column; gap: 4px; }
.mbar { display: grid; grid-template-columns: 150px 1fr 34px; gap: 8px; align-items: center; border: 0; background: none; padding: 3px 4px; border-radius: 6px; cursor: pointer; text-align: left; }
.mbar:hover, .mbar[aria-pressed="true"] { background: var(--surface-2); }
.mbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mbar .track { height: 12px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.mbar .track i { display: block; height: 100%; }
.mbar .c { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .hit { cursor: pointer; }
.chart .hit:hover rect.bg { fill: var(--surface-2); }

/* 4. Triage table */
.tbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px 0; }
.tbar h2 { font-size: 12px; margin: 0 6px 0 0; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; min-height: 30px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--surface-2); font-weight: 650; box-shadow: inset 0 -2px var(--text); }
.fchip { display: inline-flex; gap: 6px; align-items: center; background: var(--run-bg); color: var(--accent); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; font-weight: 600; }
.fchip button { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 6px; font-size: 14px; line-height: 1; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td { background: var(--surface-2); }
tbody tr.row.sel td { background: var(--run-bg); }
tbody tr.row.sel td:first-child { box-shadow: inset 3px 0 var(--accent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ttl { font-weight: 600; }
.sub { font-size: 12px; color: var(--text-2); margin-top: 2px; word-break: break-word; }
.sub.err { color: var(--critical); font-family: var(--mono); font-size: 11.5px; display: inline-block; max-width: 100%; padding: 2px 8px; margin: 3px 0 0; white-space: normal; overflow-wrap: anywhere; }
.empty { color: var(--muted); text-align: center; padding: 26px; }

/* Chips: colour always paired with text */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 7px; white-space: nowrap; letter-spacing: .02em; }
.spark { display: block; }
table.budgets td, table.formats td { vertical-align: top; }
.show-sm { display: none; }
@media (max-width: 700px) { table.budgets .hide-sm, section .hide-sm.num, table .hide-sm { display: none; } table.budgets .show-sm { display: block; } }
table.formats td:last-child { min-width: 220px; overflow-wrap: anywhere; }
.codes { margin: 4px 0 6px; font-size: 12px; color: var(--text-2); }
.codes div { overflow-wrap: anywhere; }
.sev-P0 { background: var(--critical); color: #fff; } .sev-P1 { background: var(--warn-bg); color: var(--warn-text); } .sev-P2, .sev-P3 { background: var(--skip-bg); color: var(--text-2); }
.st-NEW { background: var(--critical); color: #fff; } .st-RECURRING { background: var(--crit-bg); color: var(--critical); }
.st-REGRESSION { background: #8f1d1d; color: #fff; } .st-QUARANTINED { background: var(--skip-bg); color: var(--text-2); outline: 1px dashed var(--skipped); }
.cat { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 1px 7px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.cat i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.cat.product i { background: var(--critical); } .cat.test i { background: #7c3aed; } .cat.environment i { background: var(--warn); } .cat.infrastructure i { background: var(--accent); } .cat.review i { background: var(--skipped); }
.why-box { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
.tl { width: 100%; border-collapse: collapse; margin-top: 4px; }
.tl td { padding: 3px 6px; border-bottom: 1px dashed var(--border); font-size: 12px; vertical-align: top; overflow-wrap: anywhere; }
.cd { min-width: 0; overflow-wrap: anywhere; }
.tl td.t { font-family: var(--mono); white-space: nowrap; color: var(--muted); }
.tl tr.k-failed td, .tl tr.k-abandoned td { color: var(--critical); font-weight: 600; }
.tl tr.k-abandoned.info td { color: var(--text-2); font-weight: 500; }
.res { font-size: 12px; margin-top: 2px; grid-column: 3 / -1; color: var(--text-2); }
.res.nores { color: var(--critical); font-weight: 600; } .res.nores.info { color: var(--text-2); font-weight: 500; }
.apilog { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; background: var(--code-bg); border-radius: 8px; padding: 10px 12px; max-height: 560px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.apilog .h { color: var(--text); font-weight: 700; } .apilog .f { color: var(--critical); font-weight: 600; } .apilog .w { color: var(--warn-text); } .apilog .i, .apilog .k { color: var(--muted); }
.cmp td.b, .cmp td.a { font-variant-numeric: tabular-nums; }
.cmp .up { color: var(--critical); font-weight: 600; } .cmp .down { color: var(--good); font-weight: 600; }
.st-FLAKY, .st-WARNING { background: var(--warn-bg); color: var(--warn-text); } .st-KNOWN { background: var(--skip-bg); color: var(--text-2); }
.st-PASS { background: var(--good-bg); color: var(--good); } .st-CRASH { background: #7a1010; color: #fff; } .st-RUNNING { background: var(--run-bg); color: var(--running); }
.ver { background: var(--run-bg); color: var(--accent); font-family: var(--mono); font-weight: 500; }
.owner-mod { color: var(--muted); }

/* 5. Drawer */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 30; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--bg); border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,.18); transform: translateX(102%); transition: transform .18s ease-out; z-index: 31; display: flex; flex-direction: column; }
body.drawer-open #drawer { transform: none; }
body.drawer-open #scrim { opacity: 1; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { #drawer, #scrim { transition: none; } }
.dh { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.dh .row1 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dh h3 { font-size: 16px; margin: 6px 0 2px; word-break: break-word; }
.dh .close { margin-left: auto; }
.db { overflow-y: auto; padding: 12px 16px 40px; flex: 1; }
/* Tabs: one section at a time (test details, long pages); the open tab is in the address bar */
.stabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: thin; }
.stabs [role="tab"] { border: 0; background: none; padding: 7px 11px; border-bottom: 2px solid transparent; color: var(--text-2); font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; min-height: 36px; display: inline-flex; gap: 6px; align-items: center; }
.stabs [role="tab"]:hover { color: var(--text); }
.stabs [role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }
.stabs [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.stabs .tb { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--surface-2); color: var(--text-2); font-weight: 600; }
.stabs .tb.bad { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
.stabs .tb.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn-text); }
.dh .stabs { margin: 8px -16px -12px; padding: 0 10px; border-bottom: 0; }
.stabs.page-tabs { margin: 2px 0 12px; }
.tpane:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Unit tests tab */
details.ut { border-bottom: 1px solid var(--border); }
details.ut > summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 7px 4px; cursor: pointer; list-style: none; }
details.ut > summary::-webkit-details-marker { display: none; }
details.ut > summary .un { min-width: 0; overflow-wrap: anywhere; }
details.ut > summary .uerr { grid-column: 2 / -1; color: var(--critical); font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
details.ut.failed > summary { background: var(--crit-bg); }
details.ut .utd { padding: 4px 8px 10px 8px; }
.uexp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 6px; }
.uexp pre { max-height: 260px; }
details.ufileg { margin-bottom: 8px; }
details.ufileg > summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 12px; cursor: pointer; }
details.ufileg > summary .num { margin-left: auto; }
.ufiles { padding: 0 8px 6px; }
.covbar { height: 4px; background: var(--surface-2); border-radius: 2px; margin-top: 3px; } .covbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
@media (max-width: 700px) { .uexp { grid-template-columns: minmax(0, 1fr); } details.ut > summary { grid-template-columns: auto minmax(0, 1fr) auto; } details.ut > summary :is(.tag, .ufile) { display: none; } details.ut > summary > span:empty { display: none; } }
/* Phones: less to scroll past. The header scrolls away, the filters fold behind a button, numbers sit side by side */
#fToggle { display: none; }
@media (max-width: 700px) {
  .top { position: static; }
  #fToggle { display: inline-flex; }
  .top .bar { display: none; }
  body.filters-open .top .bar { display: flex; }
  .verdict { gap: 8px; margin: 8px 0; }
  .vbox { flex: 1 1 100%; min-width: 0; padding: 8px 12px; }
  .vbox .why { max-width: none; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .kpi { padding: 6px 7px; }
  .kpi .l { font-size: 10px; letter-spacing: .02em; }
  .kpi .n { font-size: 18px; }
  .kpi .d { font-size: 11px; }
  .callsum, .cards3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .callsum > .card { padding: 8px 10px; }
  .callsum > .card > div:nth-child(2) { font-size: 20px !important; }
  .callsum > .card > div:nth-child(3) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } /* full reasons are in the Problems tab */
  .page h1 { font-size: 18px; margin: 8px 0; }
  /* triage table on a phone: severity, test and status (module, category, since, owner and ticket are in the details) */
  table[aria-label="Triage table"] :is(th, td):is(:nth-child(3), :nth-child(4), :nth-child(6), :nth-child(7), :nth-child(8)) { display: none; }
}
.db section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; }
.db h4 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); display: flex; gap: 8px; align-items: center; }
.db h4 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions input[type=text], .actions input[type=url] { border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; min-height: 32px; background: var(--surface); min-width: 0; }
.errbox { border-color: var(--critical) !important; background: var(--crit-bg) !important; }
.errbox .m { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; color: var(--critical); font-weight: 600; }
.links { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
.links a { font-family: var(--mono); font-size: 12px; }
pre.log { background: var(--code-bg); border-radius: 8px; padding: 8px 10px; overflow: auto; max-height: 260px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
details > summary { cursor: pointer; color: var(--text-2); font-size: 12.5px; margin-top: 6px; }
ol.steps { margin: 0; padding-left: 22px; }
ol.steps li { padding: 2px 0; }
ol.steps .t { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-left: 6px; }
ol.steps li.fail { color: var(--critical); font-weight: 600; }
.evid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.evid img, .evid video { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #000; display: block; max-height: 520px; object-fit: contain; }
.evid img { cursor: zoom-in; background: var(--surface-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.diff td { padding: 5px 8px; font-size: 12.5px; }
.diff .chg td { background: var(--warn-bg); }
.tlist { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tlist button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.tlist button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.dots { display: flex; gap: 3px; flex-wrap: wrap; }
.dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; background: var(--skip-bg); }
a.dot:hover { outline: 2px solid var(--text); }
.dot.passed { background: var(--good); } .dot.failed { background: var(--critical); } .dot.warning { background: var(--warn); } .dot.cur { outline: 2px solid var(--text); outline-offset: 1px; }

/* Unsaved triage changes, toast, lightbox, tooltip */
.unsaved { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--warn-bg); color: var(--warn-text); border-radius: var(--radius); padding: 8px 12px; margin: 0 0 12px; font-weight: 600; }
.runbanner { background: var(--run-bg); color: var(--running); border-radius: var(--radius); padding: 8px 12px; margin-top: 12px; font-weight: 600; }
#toast { position: fixed; left: 16px; bottom: 16px; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; display: none; z-index: 50; font-size: 13px; }
#tip { position: fixed; pointer-events: none; z-index: 70; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.15); display: none; max-width: 320px; }

/* Secondary tabs */
.page { margin: 12px 0 40px; }
.page h1 { font-size: 18px; margin: 4px 0 10px; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
.heat td.cell { text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; cursor: pointer; }
.heat td.g { background: var(--good-bg); color: var(--good); } .heat td.a { background: var(--warn-bg); color: var(--warn-text); } .heat td.b { background: var(--crit-bg); color: var(--critical); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }
/* Lightbox */
#lb { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .82); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 16px; }
#lb.open { display: flex; }
#lb .lbwrap { position: relative; display: inline-block; line-height: 0; }
#lb img { max-height: calc(100vh - 150px); max-width: calc(100vw - 140px); border-radius: 8px; background: #000; display: block; }
#lb .ov { position: absolute; inset: 0; pointer-events: none; }
#lb .ov i { position: absolute; display: block; box-sizing: border-box; border-radius: 3px; }
#lb .ov i.act-failed { border: 2px solid #ff4d4d; background: rgba(255, 77, 77, .12); }
#lb .ov i.act-warning { border: 2px solid #fab219; }
#lb .ov i.act-passed { border: 1px solid rgba(80, 220, 80, .7); }
#lb .ov i.exp { border: 2px dashed #6db3ff; }
#lb .ov i span { position: absolute; left: 0; top: -16px; font: 600 10px/14px system-ui, sans-serif; color: #fff; background: rgba(0, 0, 0, .7); padding: 0 4px; border-radius: 3px; white-space: nowrap; }
#lb .tools { margin-top: 8px; display: flex; gap: 12px; color: #c3c2b7; font-size: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
#lb .tools label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
#lb .tools .k { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: middle; }
#lb .cap { color: #f0efec; margin-top: 12px; text-align: center; max-width: 720px; }
#lb .cap .s { font-size: 12px; color: #c3c2b7; margin-top: 2px; }
#lb button { position: absolute; background: rgba(255, 255, 255, .12); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; cursor: pointer; font-size: 20px; }
#lb button:hover { background: rgba(255, 255, 255, .22); }
#lb .x { top: 16px; right: 16px; }
#lb .p { left: 16px; top: 50%; }
#lb .nx { right: 16px; top: 50%; }


/* ---- eGenome: steps with screenshots, layout checks (from the earlier eGenome dashboard) ---- */
table.egsteps { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.egsteps th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
table.egsteps td { vertical-align: top; padding: 6px; border-bottom: 1px solid var(--border); }
table.egsteps tr.failed td { background: var(--crit-bg); }
table.egsteps tr.warned td { background: color-mix(in srgb, var(--warn-bg) 55%, transparent); }
table.egsteps .n { color: var(--muted); width: 22px; font-variant-numeric: tabular-nums; }
table.egsteps .st { width: 18px; padding-top: 7px; }
table.egsteps .call { display: block; color: var(--text-2); font-family: var(--mono); font-size: 11px; margin-top: 2px; word-break: break-word; }
table.egsteps .dur { width: 62px; text-align: right; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.egsteps .shot { width: 52px; }
.tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.si { width: 14px; height: 14px; vertical-align: -2px; }
.thumb { width: 44px; height: 78px; object-fit: cover; object-position: top; border-radius: 5px; border: 1px solid var(--border); cursor: zoom-in; display: block; background: var(--surface-2); }
.thumb:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.err { background: var(--crit-bg); border: 1px solid color-mix(in srgb, var(--critical) 35%, transparent); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.err .m { color: var(--critical); font-weight: 600; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 11.5px; }
details.more { margin-top: 4px; }
details.more > summary { cursor: pointer; color: var(--text-2); font-size: 12px; }
pre.box { background: var(--code-bg); border-radius: 8px; padding: 8px 10px; overflow: auto; max-height: 280px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 11.5px; }
ul.actions { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); font-size: 12px; }
ul.actions code { font-size: 11px; }
.lay { margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.lay > summary { cursor: pointer; padding: 6px 8px; font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; list-style: none; }
.lay > summary::-webkit-details-marker { display: none; }
.lay table { font-size: 11.5px; width: 100%; border-collapse: collapse; }
.lay td, .lay th { padding: 4px 6px; text-align: left; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
.chip.ok { color: var(--good); background: var(--good-bg); }
.chip.bad { color: var(--critical); background: var(--crit-bg); }
.chip.warn { color: var(--warn-text); background: var(--warn-bg); }
.chip.info { color: var(--text-2); background: var(--surface-2); }
.warns { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--warn-text); }
.stepfilter { font-size: 12px; color: var(--text-2); margin: 4px 0; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }
.st-SKIPPED { background: var(--skip-bg); color: var(--text-2); }
.dot.skipped { background: var(--skipped); opacity: .45; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <nav class="tabs" aria-label="Views">
      <a class="brand" style="margin-right:14px" href="#/triage" id="home"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="var(--accent)"/><path d="M7 12.5l3 3 7-7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="brandName">eGenome.ai App Tests</span></a>
      <a data-tab="triage">Triage</a><a data-tab="coverage">Coverage</a><a data-tab="performance">Performance</a><a data-tab="devices">Device matrix</a><a data-tab="history">History</a><a data-tab="api">API calls</a><a data-tab="compare">Compare</a><a data-tab="unit">Unit tests</a>
      <span class="hint" id="updated" style="margin-left:auto;padding-right:8px"></span>
      <div class="right-tools" style="margin-left:0">
        <button class="btn" id="fToggle" aria-expanded="false" aria-controls="filterBar">Filters</button>
        <label class="auto" id="autoWrap" title="Refresh by itself when a test finishes"><span class="dot-live" aria-hidden="true"></span><input type="checkbox" id="auto" checked>Auto</label>
        <button class="btn" id="refresh" title="Refresh now (r)" aria-label="Refresh now">⟳</button>
        <button class="btn" id="theme" title="Light / dark" aria-label="Switch light or dark theme"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg></button>
      </div>
    </nav>
    <div class="bar" id="filterBar" role="search" aria-label="Global filters">
      <label class="f" id="f-app"><span>App</span><select id="s-app" aria-label="App"></select></label>
      <label class="f" id="f-build"><span>Build</span><select id="s-build" aria-label="Build"></select></label>
      <label class="f" id="f-suite"><span>Suite</span><select id="s-suite" aria-label="Suite"></select></label>
      <label class="f" id="f-run"><span>Run</span><select id="s-run" aria-label="Run"></select></label>
      <label class="f" id="f-env"><span>Env</span><select id="s-env" aria-label="Environment"></select></label>
      <label class="f" id="f-platform"><span>Platform</span><select id="s-platform" aria-label="Platform (device and Android version)"></select></label>
      <button class="toggle" id="mine" aria-pressed="false" title="Only issues owned by or assigned to you">Only mine</button>
      <input class="search" id="q" type="search" placeholder="Search tests, errors, modules  ( / )" aria-label="Search">
    </div>
  </div>
</header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Test details" tabindex="-1"></aside>
<div id="lb" role="dialog" aria-modal="true" aria-label="Screenshot viewer">
  <button class="x" aria-label="Close">✕</button>
  <button class="p" aria-label="Previous">‹</button>
  <button class="nx" aria-label="Next">›</button>
  <div class="lbwrap"><img alt=""><div class="ov"></div></div>
  <div class="cap"><div class="t"></div><div class="s"></div></div>
  <div class="tools" hidden>
    <span><i class="k" style="border:2px solid #ff4d4d"></i> actual (failed)</span>
    <span><i class="k" style="border:2px dashed #6db3ff"></i> expected</span>
    <label><input type="checkbox" id="allBoxes"> show every checked element</label>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const app = $('#app');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} },
  };

  // ---------------------------------------------------------------- formatting
  const fmtDate = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—');
  const dur = (ms) => { if (ms == null) return '—'; if (ms < 1000) return Math.round(ms) + ' ms'; const s = Math.round(ms / 1000); return s < 60 ? (ms / 1000).toFixed(1) + ' s' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's'; };
  // ---- eGenome steps: every page-object call and assertion, with the screen after it and its layout checks
  const SLABEL = { passed: 'Passed', failed: 'Failed', skipped: 'Skipped', running: 'Running', aborted: 'Aborted' };
  const SICON = {
    passed: '<svg class="si" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--good)"/><path d="M4.8 8.3l2.2 2.2 4.2-4.6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    failed: '<svg class="si" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--critical)"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
    skipped: '<svg class="si" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--skipped)"/><path d="M5 8h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
    running: '<svg class="si" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--running)" stroke-width="2" stroke-dasharray="20 18"/></svg>',
  };
  const statusIcon = (st) => `<span title="${SLABEL[st] || st}">${SICON[st] || ''}</span>`;
  const KIND = { action: 'Action', assertion: 'Assertion', step: 'Step', hook: 'Hook' };
  /** Every screen of a test for the viewer: one per step that has a screenshot, then the screen at failure. */
  function egShots(rec) {
    const shots = [];
    (rec.stepsDetail || []).forEach((s) => { if (s.screenshot) shots.push({ src: s.screenshot, status: s.status, title: `${s.n}. ${s.title}`, sub: rec.title, layout: s.layout && s.layout.elements ? s.layout.elements : null, n: s.n }); });
    if (rec.failureScreenshot && !shots.some((x) => x.src === rec.failureScreenshot)) shots.push({ src: rec.failureScreenshot, status: 'failed', title: 'Screen at failure', sub: rec.title });
    return shots;
  }
  function egLayoutBlock(s) {
    const L = s.layout;
    if (!L) return '';
    if (L.updated) return `<div style="margin-top:6px"><span class="chip info">Layout baseline "${esc(L.spec)}" re-recorded · ${esc(L.elements)} elements, ${esc(L.rules)} rules</span></div>`;
    const m = L.summary || {};
    const order = { failed: 0, warning: 1, skipped: 2, passed: 3 };
    const rows = [...(L.results || [])].sort((a, b) => order[a.status] - order[b.status]);
    const ic = (st) => (st === 'failed' ? SICON.failed : st === 'passed' ? SICON.passed : st === 'warning' ? '<span title="Warning" style="color:var(--warn-text);font-weight:700">!</span>' : SICON.skipped);
    const row = (r) => `<tr class="${esc(r.status)}"><td>${ic(r.status)}</td><td>${esc(r.type)}</td><td>${esc(r.target)}</td><td>${esc(r.expected || '')}</td><td>${esc(r.message && r.status !== 'passed' ? r.message : r.actual || '')}</td></tr>`;
    const head = '<thead><tr><th></th><th>Check</th><th>Element(s)</th><th>Expected</th><th>Actual</th></tr></thead>';
    const issues = rows.filter((r) => r.status !== 'passed'), passed = rows.filter((r) => r.status === 'passed');
    return `<details class="lay"${m.failed ? ' open' : ''}><summary><b>Layout "${esc(L.spec)}"</b>
        <span class="chip ${m.failed ? 'bad' : 'ok'}">${m.passed}/${m.total} passed</span>${m.failed ? `<span class="chip bad">${m.failed} failed</span>` : ''}${m.warnings ? `<span class="chip warn">${m.warnings} warning${m.warnings === 1 ? '' : 's'}</span>` : ''}${m.skipped ? `<span class="chip info">${m.skipped} skipped</span>` : ''}
        ${L.reviewed ? '' : '<span class="chip info" title="Spec generated from captures and not yet approved">spec not reviewed</span>'}${L.aspectMatches === false ? '<span class="chip info" title="Different screen shape: absolute positions skipped, relations still checked">other aspect ratio</span>' : ''}${L.mode === 'warn' ? '<span class="chip warn">warn-only mode</span>' : ''}
        <span class="muted">open the screenshot to see the boxes</span></summary>
      ${issues.length ? `<div class="tbl-wrap"><table>${head}<tbody>${issues.map(row).join('')}</tbody></table></div>` : ''}
      ${passed.length ? `<details class="more" style="padding:0 8px 6px"><summary>${passed.length} passed check${passed.length === 1 ? '' : 's'}</summary><div class="tbl-wrap"><table>${head}<tbody>${passed.map(row).join('')}</tbody></table></div></details>` : ''}</details>`;
  }
  function egStepsHtml(rec, shots) {
    const steps = rec.stepsDetail || [];
    if (!steps.length) return `<p class="muted">${rec.status === 'skipped' ? 'Not run: skipped (it.skip, or an earlier hook or test failed).' : 'No steps recorded.'}</p>`;
    return `<div class="tbl-wrap"><table class="egsteps"><thead><tr><th>#</th><th></th><th>Step</th><th style="text-align:right">Time</th><th>Screen</th></tr></thead><tbody>${steps.map((s) => {
      const si = s.screenshot ? shots.findIndex((x) => x.src === s.screenshot) : -1;

        lastPass, regression: regression && !qActive && !known, regressionWhy, testChanged, testChangedWhy, category: problem ? category : null, categoryWhy: problem ? categoryWhy : null, categoryBy, quarantine: q, qActive, qExpired });
    }
    const s = run.summary;
    return {
      run, tests,
      kpi: {
        total: s.total, passRate: pct(s.total - s.failed - (s.skipped || 0), s.total - (s.skipped || 0)), failed: s.failed, skipped: s.skipped || 0,
        newF: tests.filter((t) => t.isNew).length, flaky: tests.filter((t) => t.flaky).length,
        regressions: tests.filter((t) => t.st === 'REGRESSION').length, quarantined: tests.filter((t) => t.st === 'QUARANTINED').length,
        crash: tests.filter((t) => t.crash).length, warnings: s.withWarnings, apiFailed: (run.api || {}).failed || 0,
      },
    };
  }
  function verdictOf(A) {
    if (!A) return { v: 'NONE', why: 'No runs match the filters.' };
    const r = A.run;
    if (r.setupError) return { v: 'BLOCKED', why: 'The run could not start: ' + r.setupError };
    const open = A.tests.filter((t) => t.problem && t.st !== 'KNOWN' && t.st !== 'QUARANTINED');
    const expired = A.tests.filter((t) => t.problem && t.qExpired);
    const blockers = open.filter((t) => t.st !== 'FLAKY' && (t.crash || t.severity === 'P0' || (t.st === 'REGRESSION' && t.severity !== 'P2' && t.severity !== 'P3')));
    const q = A.tests.filter((t) => t.st === 'QUARANTINED').length;
    const bw = (r.budget && r.budget.warnings.length) || 0;
    const tail = [q ? `${q} quarantined failure${q > 1 ? 's' : ''} not counted` : '', expired.length ? `quarantine expired for ${expired.map((t) => t.T.id || t.T.name).join(', ')}` : '', bw ? `${bw} performance / API budget warning${bw > 1 ? 's' : ''} (Performance tab)` : ''].filter(Boolean);
    const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
    if (blockers.length) {
      const crashes = blockers.filter((t) => t.crash).length, regs = blockers.filter((t) => !t.crash && t.st === 'REGRESSION').length, p0 = blockers.length - crashes - regs;
      return { v: 'BLOCKED', why: [p0 ? plural(p0, 'P0 failure') : '', regs ? plural(regs, 'regression') : '', crashes ? plural(crashes, 'crash').replace('crashs', 'crashes') : '', ...tail].filter(Boolean).join(' · ') };
    }
    if (open.length || A.kpi.flaky) {
      const fl = open.filter((t) => t.st === 'FLAKY').length;
      return { v: 'UNSTABLE', why: [open.length - fl ? plural(open.length - fl, 'non-blocking failure') : '', A.kpi.flaky ? A.kpi.flaky + ' flaky' : '', ...tail].filter(Boolean).join(' · ') };
    }
    if (!A.kpi.total) return { v: 'NONE', why: runState(r) === 'running' ? 'Waiting for the first test…' : 'No tests recorded.' };
    return { v: 'PASS', why: [A.kpi.warnings ? A.kpi.warnings + ' test(s) with warnings' : 'All tests passed', ...tail].join(' · ') };
  }

  // Group problem tests by error signature: one row per root cause.
  function groupRows(A) {
    const groups = new Map();
    for (const t of A.tests.filter((x) => x.problem)) {
      const key = t.cur.sig || 't:' + t.T.name;
      if (!groups.has(key)) groups.set(key, { key, sig: t.cur.sig, sigText: t.cur.sigText, tests: [] });
      groups.get(key).tests.push(t);
    }
    return [...groups.values()].map((g) => {
      const iss = g.sig ? issueOf(g.sig) : {};
      const sts = g.tests.map((t) => t.st);
      const st = g.tests.some((t) => t.crash) && !iss.known ? 'CRASH' : iss.known ? 'KNOWN' : sts.every((x) => x === 'QUARANTINED') ? 'QUARANTINED' : sts.includes('REGRESSION') ? 'REGRESSION' : sts.includes('NEW') ? 'NEW' : sts.every((x) => x === 'FLAKY') ? 'FLAKY' : 'RECURRING';
      const catT = g.tests.find((t) => t.categoryBy === 'person') || g.tests[0];
      const severity = g.tests.map((t) => t.severity).sort((a, b) => SEV_ORDER[a] - SEV_ORDER[b])[0];
      const modules = [...new Set(g.tests.map((t) => t.module))];
      const sinceIds = g.tests.map((t) => t.sinceRun).filter(Boolean).sort();
      const flakyT = g.tests.find((t) => t.flaky);
      return Object.assign(g, { st, severity, modules, sinceRun: sinceIds[0], category: catT.category, categoryWhy: catT.categoryWhy, owner: iss.owner || '', ownerFromModule: iss.owner ? '' : moduleOwner(modules[0]), ticket: iss.ticket || '', isNew: sts.includes('NEW'), flakyText: flakyT ? flakyT.fails + '/' + flakyT.n : '' });
    });
  }

  // ================================================================ RENDER
  let A = null, Aprev = null, runsF = [], current = null, rows = [], selIndex = 0;

  function fillSelect(sel, values, cur, allLabel) {
    sel.innerHTML = `<option value="">${esc(allLabel)}</option>` + values.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`).join('');

  }
  function renderFilters() {

      $('#s-app').innerHTML = APPS.apps.map((a) => `<option value="${esc(a.id)}"${a.id === APPS.current ? ' selected' : ''}${a.ready || a.id === APPS.current ? '' : ' disabled'}>${esc(label(a))}</option>`).join('');

    } else fillSelect($('#s-app'), uniq(runsFiltered('app').map((r) => [r.apk.application_id || '?', r.apk.application_id || '?'])), S.app, 'All apps');
    fillSelect($('#s-build'), uniq(runsFiltered('build').map((r) => [buildKey(r), buildLabel(r.apk) + ' · ' + verLabel(r.apk)])), S.build, 'All builds');
    fillSelect($('#s-env'), uniq(runsFiltered('env').map((r) => [r.env, r.env])), S.env, 'All envs');
    fillSelect($('#s-suite'), uniq(runsFiltered('suite').map((r) => [suiteKey(r), suiteKey(r) === 'all' ? 'all specs' : suiteKey(r)])), S.suite, 'All suites');
    fillSelect($('#s-platform'), uniq(runsFiltered('platform').map((r) => [platKey(r), platKey(r)])), S.platform, 'All platforms');
    fillSelect($('#s-run'), runsFiltered().map((r) => [r.id, r.id + ' · ' + buildLabel(r.apk) + ' · ' + runState(r)]), S.run, 'Latest run');
    $('#mine').setAttribute('aria-pressed', String(S.mine));
    $('#mine').textContent = S.mine ? 'Only mine: ' + (store.get('egDashMe', '') || '?') : 'Only mine';
    if (document.activeElement !== $('#q')) $('#q').value = S.q;
    $$('.tabs a').forEach((a) => { a.href = '#/' + a.dataset.tab + location.hash.replace(/^#\/[^?]*/, ''); if (a.dataset.tab === S.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });

  }

  function render() {
    if (!idx) return;
    runsF = runsFiltered();
    current = runsF.find((r) => r.id === S.run) || runsF[0] || null;
    // Compare with the previous run of the SAME suite (a tour run is not compared with a smoke run)
    const prevRun = current ? runsF.slice(runsF.indexOf(current) + 1).find((r) => suiteKey(r) === suiteKey(current)) || null : null;
    A = analyse(current, runsF);
    Aprev = analyse(prevRun, runsF);
    renderFilters();
    // Phones: the filters fold behind a button that says how many are set
    { const n = $$('#filterBar .f.on').length + (S.q ? 1 : 0), b = $('#fToggle'); if (b) b.textContent = n ? `Filters · ${n} set` : 'Filters'; }
    const head = S.tab === 'unit' ? '' : verdictHtml(); // the unit tests have their own verdict
    const body = { triage: triageHtml, coverage: coverageHtml, performance: perfHtml, devices: devicesHtml, history: historyHtml, api: apiHtml, compare: compareHtml, unit: unitHtml }[S.tab] || triageHtml;
    app.innerHTML = unsavedHtml() + (current && runState(current) === 'running' ? `<div class="runbanner">Run ${esc(current.id)} is running: ${current.summary.total} test(s) done so far. This page updates after every test.</div>` : '') + head + body();

  // ---------------------------------------------------------------- 2. verdict + KPIs
  function verdictHtml() {
    if (!idx.runs.length) return '<p class="empty">No test runs yet. Run a suite in this project (for example <code>npm run test:smoke</code>); this page fills in by itself.</p>';
    const V = verdictOf(A);
    const k = A ? A.kpi : {}, p = Aprev ? Aprev.kpi : null;
    const delta = (key, goodIsUp, unit = '') => {
      if (!p) return '<span class="d">no earlier run</span>';
      const d = Math.round((k[key] - p[key]) * 10) / 10;
      if (!d) return '<span class="d">= last run</span>';
      const bad = goodIsUp ? d < 0 : d > 0;
      return `<span class="d ${bad ? 'bad' : 'good'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit} vs last</span>`;
    };
    const kpi = (f, label, val, key, goodIsUp, color, unit = '') => `<button class="kpi${f && (key === 'crash' || key === 'newF' || key === 'apiFailed' || key === 'regressions') && val ? ' alert' : ''}" style="--c:${color}" data-kpi="${f}" aria-pressed="${f === 'api' ? S.tab === 'api' : S.tab === 'triage' && S.f === f}" title="${f === 'api' ? 'Show the failed API calls' : 'Show these in the triage table'}">

    const r = current;
    return `<section class="verdict" aria-label="Verdict">
      <div class="vbox ${V.v}" role="status"><div class="v"><span aria-hidden="true">${{ PASS: '✓', UNSTABLE: '≈', BLOCKED: '■', NONE: '–' }[V.v]}</span>${V.v === 'NONE' ? 'NO DATA' : V.v}</div>
        <div class="why">${esc(V.why)}</div>
        ${r ? `<div class="run">${esc(buildLabel(r.apk))} · ${esc(verLabel(r.apk))} · ${esc(suiteKey(r))} · run ${esc(r.id)}</div>
        <button class="vlink" data-run-details="${esc(r.id)}">Run details: ${esc((r.details && r.details.trigger) || 'unknown trigger')}${r.details && r.details.project && r.details.project.branch ? ' · ' + esc(r.details.project.branch) : ''} ›</button>` : ''}</div>

        ${kpi('all', 'Pass rate', k.passRate, 'passRate', true, 'var(--good)', '%')}
        ${kpi('failures', 'Failed', k.failed, 'failed', false, 'var(--critical)')}
        ${kpi('regressions', 'Regressions', k.regressions, 'regressions', false, '#8f1d1d')}
        ${kpi('new', 'New failures', k.newF, 'newF', false, 'var(--critical)')}
        ${kpi('flaky', 'Flaky', k.flaky, 'flaky', false, 'var(--warn)')}
        ${kpi('crash', 'Crashes', k.crash, 'crash', false, '#7a1010')}
        ${kpi('warnings', 'With warnings', k.warnings, 'warnings', false, 'var(--warn)')}
        ${kpi('api', 'API failures', k.apiFailed, 'apiFailed', false, 'var(--critical)')}
      </div>` : ''}
    </section>`;
  }

  // ---------------------------------------------------------------- unsaved triage edits
  function unsavedHtml() {
    const n = Object.keys(edits()).length + Object.keys(qEdits()).length;
    if (!n) return '';
    return `<div class="unsaved" role="status" style="margin-top:12px"><span>⚠ ${n} triage change${n > 1 ? 's' : ''} saved only in this browser.</span>

      <button class="btn" id="discard-triage" style="margin-left:auto">Discard</button></div>`;
  }
  function downloadTriage() {
    const base = JSON.parse(JSON.stringify(idx.triage || {}));
    base.issues = base.issues || {};
    for (const [sig, patch] of Object.entries(edits())) base.issues[sig] = Object.assign({}, base.issues[sig] || {}, patch);
    for (const [sig, v] of Object.entries(base.issues)) { for (const k of Object.keys(v)) if (v[k] === '' || v[k] === false) delete v[k]; if (!Object.keys(v).length) delete base.issues[sig]; }
    base.quarantine = quarantineList();
    const blob = new Blob([JSON.stringify(base, null, 2) + '\n'], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'triage.json'; document.body.appendChild(a); a.click(); a.remove();
    toast('Downloaded triage.json: move it to test/triage.json and commit. Then "Discard" here.');
  }

  // ---------------------------------------------------------------- 3 + 4. triage view
  function visibleRows() {
    if (!A) return [];
    const me = store.get('egDashMe', '');
    const q = S.q.toLowerCase();
    let list;
    if (['failures', 'new', 'crash', 'known', 'regressions', 'quarantined'].includes(S.f)) {
      list = groupRows(A).map((g) => ({ kind: 'group', g }));
      if (S.f === 'regressions') list = list.filter((x) => x.g.st === 'REGRESSION' || x.g.tests.some((t) => t.st === 'REGRESSION'));
      if (S.f === 'quarantined') list = list.filter((x) => x.g.st === 'QUARANTINED');
      if (S.f === 'new') list = list.filter((x) => x.g.isNew);
      if (S.f === 'crash') list = list.filter((x) => x.g.st === 'CRASH' || x.g.tests.some((t) => t.crash));

      if (S.f === 'warnings') ts = ts.filter((t) => t.st === 'WARNING');
      list = ts.map((t) => ({ kind: 'test', g: { category: t.category, categoryWhy: t.categoryWhy, key: 't:' + t.T.name, sig: t.cur.sig, sigText: t.cur.sigText || t.cur.message, tests: [t], st: t.st === 'PASS' && t.flaky ? 'FLAKY' : t.st, severity: t.severity, modules: [t.module], sinceRun: t.sinceRun, owner: t.cur.sig ? issueOf(t.cur.sig).owner || '' : '', ownerFromModule: t.cur.sig && issueOf(t.cur.sig).owner ? '' : moduleOwner(t.module), ticket: t.cur.sig ? issueOf(t.cur.sig).ticket || '' : '', isNew: t.isNew, flakyText: t.flaky ? t.fails + '/' + t.n : '' } }));

    list.sort((a, b) => SEV_ORDER[a.g.severity] - SEV_ORDER[b.g.severity] || (b.g.isNew - a.g.isNew) || ST_ORDER[a.g.st] - ST_ORDER[b.g.st] || a.g.modules[0].localeCompare(b.g.modules[0]) || a.g.tests[0].T.name.localeCompare(b.g.tests[0].T.name, undefined, { numeric: true }));
    return list;
  }

  function modulesChart() {
    if (!A) return '';
    const per = new Map();
    for (const t of A.tests) {
      if (!per.has(t.module)) per.set(t.module, { m: t.module, fail: 0, newF: 0, flaky: 0, total: 0 });
      const x = per.get(t.module); x.total++;
      if (t.problem) { x.fail++; if (t.isNew) x.newF++; if (t.st === 'FLAKY') x.flaky++; }
    }
    const list = [...per.values()].filter((x) => x.fail).sort((a, b) => b.fail - a.fail || b.newF - a.newF);
    const ok = [...per.values()].filter((x) => !x.fail).length;
    if (!list.length) return `<p class="empty" style="padding:18px">✓ No failures in this run (${per.size} module${per.size === 1 ? '' : 's'} tested).</p>`;
    const max = Math.max(...list.map((x) => x.fail));
    return `<div class="mbars">${list.map((x) => `<button class="mbar" data-module="${esc(x.m)}" aria-pressed="${S.module === x.m}" title="Filter the table to ${esc(x.m)}">
        <span class="nm">${esc(x.m)}</span>
        <span class="track" aria-hidden="true"><i style="width:${(x.newF / max) * 100}%;background:var(--critical)"></i><i style="width:${((x.fail - x.newF - x.flaky) / max) * 100}%;background:color-mix(in srgb, var(--critical) 55%, var(--surface))"></i><i style="width:${(x.flaky / max) * 100}%;background:var(--warn)"></i></span>
        <span class="c">${x.fail}</span><span class="sr">${x.newF} new, ${x.flaky} flaky, of ${x.total} tests</span></button>`).join('')}</div>

  }

  function trendChart() {
    if (!current) return '';
    const at = runsF.indexOf(current);
    const runs = runsF.slice(at, at + 14).reverse();
    const W = 640, H = 170, L = 30, R = 30, T = 10, B = 26;
    const iw = W - L - R, ih = H - T - B, step = iw / Math.max(runs.length, 1), bw = Math.min(26, step * 0.6);
    const maxF = Math.max(1, ...runs.map((r) => r.summary.failed));
    const x = (i) => L + step * i + step / 2;
    const yP = (p) => T + ih - (p / 100) * ih;
    const pts = runs.map((r, i) => [x(i), yP(pct(r.summary.total - r.summary.failed, r.summary.total || 1))]);
    const grid = [0, 50, 100].map((p) => `<line x1="${L}" x2="${W - R}" y1="${yP(p)}" y2="${yP(p)}" stroke="var(--border)"/><text x="${L - 4}" y="${yP(p) + 3}" font-size="10" text-anchor="end" fill="var(--muted)">${p}%</text>`).join('');
    const bars = runs.map((r, i) => {
      const h = (r.summary.failed / maxF) * ih * 0.6;
      const isCur = r.id === current.id;
      return `<g class="hit" data-run="${esc(r.id)}" data-tip="${esc(r.id + ' · ' + buildLabel(r.apk) + ' · ' + pct(r.summary.total - r.summary.failed, r.summary.total || 1) + '% pass · ' + r.summary.failed + ' failed')}">
        <rect class="bg" x="${x(i) - step / 2}" y="${T}" width="${step}" height="${ih}" fill="${isCur ? 'var(--run-bg)' : 'transparent'}"/>
        ${h ? `<rect x="${x(i) - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="var(--critical)" opacity=".85"/>` : ''}
        <text x="${x(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="${isCur ? 'var(--text)' : 'var(--muted)'}" font-weight="${isCur ? 700 : 400}">${esc(axisLabel(r))}</text></g>`;
    }).join('');
    const line = pts.length > 1 ? `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--good)" stroke-width="2"/>` : '';
    const dots = pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--good)" pointer-events="none"/>`).join('');
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pass rate and failures over the last ${runs.length} runs">${grid}${bars}${line}${dots}
      <text x="${W - R + 4}" y="${T + ih - ih * 0.6 + 3}" font-size="10" fill="var(--muted)">${maxF}</text></svg></div>`;
  }

  function triageHtml() {
    if (!idx.runs.length) return '';
    rows = visibleRows();
    if (selIndex >= rows.length) selIndex = Math.max(0, rows.length - 1);
    const seg = (f, label, n) => `<button data-f="${f}" aria-pressed="${S.f === f}">${label}${n != null ? ` <span class="muted">${n}</span>` : ''}</button>`;
    const groups = A ? groupRows(A) : [];
    const runLabel = (id) => { const r = idx.runs.find((x) => x.id === id); return r ? buildLabel(r.apk) : id; };
    const table = rows.length ? `<div class="tbl-wrap"><table aria-label="Triage table">
      <thead><tr><th>Sev</th><th>Test / Issue</th><th>Module</th><th>Category</th><th>Status</th><th>Since</th><th>Owner</th><th>Ticket</th></tr></thead>
      <tbody>${rows.map((x, i) => {
        const g = x.g; const t0 = g.tests[0];
        const title = g.tests.length > 1 ? esc(t0.cur.message || g.sigText) : esc(t0.T.title);
