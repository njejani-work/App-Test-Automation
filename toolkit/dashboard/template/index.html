        const sinceTxt = g.sinceRun ? (g.sinceRun === current.id ? 'this run' : runLabel(g.sinceRun)) : '';
        return `<tr class="row${i === selIndex ? ' sel' : ''}" data-i="${i}" data-key="${esc(g.key)}" aria-selected="${i === selIndex}">
          <td>${chipSev(g.severity)}</td>
          <td><div class="ttl">${title}</div><div class="sub">${subtitle}</div></td>
          <td>${esc(g.modules.join(', '))}</td>
          <td>${chipCat(g.category, g.categoryWhy)}</td>
          <td>${chipSt(g.st, g.st === 'FLAKY' ? g.flakyText : '')}${g.tests.some((t) => t.crash) && g.st !== 'CRASH' ? ' ' + chipSt('CRASH') : ''}</td>
          <td>${g.sinceRun ? `<a href="#" data-goto-run="${esc(g.sinceRun)}" title="First run of this failure streak: ${esc(g.sinceRun)}">${esc(sinceTxt)}</a>` : '<span class="muted">—</span>'}</td>
          <td>${g.owner ? esc(g.owner) : g.ownerFromModule ? `<span class="owner-mod" title="Module owner (not assigned yet)">${esc(g.ownerFromModule)}</span>` : '<span class="muted">—</span>'}</td>
          <td>${g.ticket ? `<a href="${esc(g.ticket)}" target="_blank" rel="noopener">${esc(g.ticket.replace(/^https?:\/\/(www\.)?/, '').replace(/^github\.com\/[^/]+\/[^/]+\/issues\//, '#').slice(0, 24))}</a>` : g.sig ? `<button class="btn" style="min-height:24px;padding:1px 8px;font-size:12px" data-ticket="${esc(g.key)}">+ Link</button>` : ''}</td>
        </tr>`; }).join('')}</tbody></table></div>`
      : `<p class="empty">${{ failures: 'No open failures in this run.', new: 'No new failures since the previous run.', flaky: 'No flaky tests in the last 10 runs.', crash: 'No crashes.', known: 'No known issues in this run.', warnings: 'No tests with warnings.', all: 'No tests.' }[S.f] || 'Nothing matches.'}${S.mine || S.module || S.q ? ' (filters are on)' : ''}</p>`;
    const openN = groups.filter((g) => g.st !== 'KNOWN' && g.st !== 'QUARANTINED').length;
    return tabify(`<!--tab key=triage|label=Triage|badge=${openN ? openN + ' open' : 'none open'}|tone=${openN ? 'bad' : ''}-->
      <section class="card" style="margin-bottom:40px">
        <div class="tbar"><h2>Triage</h2>
          <div class="seg" role="group" aria-label="Show">${seg('failures', 'Open failures', groups.filter((g) => g.st !== 'KNOWN' && g.st !== 'QUARANTINED').length)}${seg('regressions', 'Regressions', groups.filter((g) => g.st === 'REGRESSION').length)}${seg('new', 'New', groups.filter((g) => g.isNew).length)}${seg('flaky', 'Flaky', A ? A.kpi.flaky : 0)}${seg('crash', 'Crashes', A ? A.kpi.crash : 0)}${seg('known', 'Known', groups.filter((g) => g.st === 'KNOWN').length)}${seg('quarantined', 'Quarantined', groups.filter((g) => g.st === 'QUARANTINED').length)}${seg('warnings', 'Warnings', A ? A.kpi.warnings : 0)}${seg('all', 'All tests', A ? A.tests.length : 0)}</div>
          <label class="f${S.cat ? ' on' : ''}" style="min-height:30px"><span>Category</span><select id="s-cat" aria-label="Failure category"><option value="">All</option>${Object.entries(CATS).map(([k, v]) => `<option value="${k}"${S.cat === k ? ' selected' : ''}>${v} (${groups.filter((g) => g.category === k).length})</option>`).join('')}</select></label>
          ${S.module ? `<span class="fchip">Module: ${esc(S.module)}<button data-clear="module" aria-label="Clear module filter">×</button></span>` : ''}
          ${S.mine ? `<span class="fchip">Owner: ${esc(store.get('egDashMe', '') || '?')}<button data-clear="mine" aria-label="Clear only mine">×</button></span>` : ''}
          <span class="muted" style="margin-left:auto;font-size:12px"><span class="kbd">j</span>/<span class="kbd">k</span> move · <span class="kbd">Enter</span> open · <span class="kbd">Esc</span> close</span>
        </div>
        <div class="card-b">${table}</div>
      </section>
      <!--tab key=overview|label=Overview: modules and trend-->${consolidatedHtml()}<div class="grid2">
        <section class="card"><div class="card-h"><h2>Failures by module</h2><div class="r legend"><span><i style="background:var(--critical)"></i>New</span><span><i style="background:color-mix(in srgb, var(--critical) 55%, var(--surface))"></i>Recurring</span><span><i style="background:var(--warn)"></i>Flaky</span></div></div><div class="card-b">${modulesChart()}</div></section>
        <section class="card"><div class="card-h"><h2>Trend · last ${Math.min(14, runsF.length - runsF.indexOf(current))} runs</h2><div class="r legend"><span><i style="background:var(--good)"></i>Pass rate</span><span><i style="background:var(--critical)"></i>Failures</span><span>click a run to open it</span></div></div><div class="card-b">${trendChart()}</div></section>
      </div>
      <!--tab key=runs|label=All runs|badge=${runsF.length}-->` + runsTableHtml() + '<!--/tabs-->', 'triage', 'Triage page');
  }

  // ---------------------------------------------------------------- consolidated results of all runs (like the eGenome.ai overview)
  function consolidatedHtml() {
    if (!runsF.length) return '';
    const t = runsF.reduce((a, r) => {
      const s = r.summary, api = r.api || {};
      a.runs++; a.tests += s.total; a.passed += s.passed; a.failed += s.failed; a.warn += s.withWarnings || 0; a.crash += s.crashes || 0;
      a.calls += api.calls || 0; a.apiFailed += api.failed || 0; a.apiWarn += api.warnings || 0; a.apiKnown += api.known || 0; a.ms += r.durationMs || 0;
      const st = runState(r); if (st === 'passed' || st === 'warning') a.runsPassed++; else if (st === 'failed') a.runsFailed++; else a.runsOther++;
      return a;
    }, { runs: 0, runsPassed: 0, runsFailed: 0, runsOther: 0, tests: 0, passed: 0, failed: 0, warn: 0, crash: 0, calls: 0, apiFailed: 0, apiWarn: 0, apiKnown: 0, ms: 0 });
    const P = (n, of) => (of ? Math.round((n / of) * 1000) / 10 + '%' : '');
    const tile = (go, label, n, unit, color, pctTxt, s1, s2, alert) => `<button class="tile${alert ? ' alert' : ''}" style="--c:${color}" data-go="${go}">
        <div class="top-row"><span>${label}</span><span>${pctTxt || ''}</span></div><div class="n">${n} <small>${unit}</small></div><div class="s"><span>${s1}</span><span>${s2 || ''}</span></div></button>`;
    const first = runsF[runsF.length - 1], last = runsF[0];
    return `<section class="card cons" aria-label="All runs, consolidated">
      <div class="lbl"><span>All runs · consolidated</span><span>${t.runs} run${t.runs === 1 ? '' : 's'} kept${S.app || S.build || S.env || S.platform ? ' (matching the filters)' : ''}</span><span>${fmtDate(first.startedAt)} → ${fmtDate(last.startedAt)}</span></div>
      <div class="tiles">
        ${tile('runs', 'Runs', t.runs, 'runs', 'var(--text-2)', '', `${t.runsPassed} passed`, `${t.runsFailed} failed${t.runsOther ? ' · ' + t.runsOther + ' other' : ''}`)}
        ${tile('history', 'Tests run', t.tests, 'tests', 'var(--text-2)', '', `avg ${t.runs ? Math.round(t.tests / t.runs) : 0}/run`, `avg ${dur(t.runs ? t.ms / t.runs : 0)}`)}
        ${tile('history', 'Passed', t.passed, 'tests', 'var(--good)', P(t.passed, t.tests), `${t.passed - t.warn} clean`, `${t.warn} with warnings`)}
        ${tile('history', 'Failed', t.failed, 'tests', 'var(--critical)', P(t.failed, t.tests), `${t.crash} crash${t.crash === 1 ? '' : 'es'}`, '', t.failed > 0)}
        ${tile('history', 'Warnings', t.warn, 'tests', 'var(--warn)', P(t.warn, t.tests), 'passed with warnings', '')}
        ${tile('api', 'API calls', t.calls, 'calls', t.apiFailed ? 'var(--critical)' : 'var(--accent)', '', `${t.apiFailed} failed`, `${t.apiWarn} warn · ${t.apiKnown} known`, t.apiFailed > 0)}
      </div>
      <div class="sbar" aria-hidden="true"><i style="width:${(t.passed - t.warn) / (t.tests || 1) * 100}%;background:var(--good)"></i><i style="width:${t.warn / (t.tests || 1) * 100}%;background:var(--warn)"></i><i style="width:${t.failed / (t.tests || 1) * 100}%;background:var(--critical)"></i></div>
    </section>`;
  }

  function runsTableHtml() {
    if (!runsF.length) return '';
    return `<section class="card" id="runs" style="margin-bottom:40px"><div class="card-h"><h2>All runs</h2><div class="r">${runsF.length} kept · click a run to open it</div></div>
      <div class="card-b tbl-wrap"><table aria-label="All runs"><thead><tr><th>Run</th><th>Started</th><th class="num">Duration</th><th>Build</th><th>Suite</th><th>Trigger</th><th>Device</th><th class="num">Tests</th><th class="num">Passed</th><th class="num">Failed</th><th class="num">Warnings</th><th class="num">API calls</th><th class="num">API failed</th><th>Status</th></tr></thead>
      <tbody>${runsF.map((r) => { const s = r.summary, api = r.api || {}, st = runState(r); const lab = { passed: 'PASS', warning: 'WARNING', failed: 'FAILED', running: 'RUNNING', incomplete: 'INCOMPLETE' }[st] || st;
        return `<tr class="row${current && r.id === current.id ? ' sel' : ''}" data-run-row="${esc(r.id)}">
          <td class="mono">${esc(r.id)}</td><td>${fmtDate(r.startedAt)}</td><td class="num">${st === 'running' ? '…' : dur(r.durationMs)}</td>
          <td><span class="chip ver">${esc(buildLabel(r.apk))} · ${esc(verLabel(r.apk))}</span></td><td>${esc((r.suites || []).join(', ') || 'all')}</td><td class="muted" style="font-size:12px">${esc((r.details && r.details.trigger) || '—')}${r.details && r.details.ci && r.details.ci.url ? ` <a href="${esc(r.details.ci.url)}" target="_blank" rel="noopener">job</a>` : ''}</td><td class="muted">${esc(devName(r.device))}</td>
          <td class="num">${s.total}</td><td class="num" style="color:var(--good);font-weight:600">${s.passed}</td><td class="num"${s.failed ? ' style="color:var(--critical);font-weight:700"' : ''}>${s.failed}</td><td class="num"${s.withWarnings ? ' style="color:var(--warn-text);font-weight:600"' : ''}>${s.withWarnings || 0}</td>
          <td class="num">${api.calls ?? '—'}</td><td class="num"${api.failed ? ' style="color:var(--critical);font-weight:700"' : ''}>${api.calls != null ? api.failed : '—'}</td>
          <td>${chipSt(st === 'passed' ? 'PASS' : st === 'warning' ? 'WARNING' : st === 'failed' ? 'NEW' : st === 'running' ? 'RUNNING' : 'KNOWN', '', lab)}${current && r.id !== current.id ? ` <a href="#" data-compare-row="${esc(r.id)}" title="Compare this run with the selected run ${esc(current.id)}" style="font-size:12px;white-space:nowrap">compare</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div></section>`;
  }

  // ---------------------------------------------------------------- API calls: every call from initiation to resolution
  const kb = (b) => (b == null ? 'size not logged' : b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB');
  const kbShort = (b) => (b == null ? '—' : kb(b));
  // fail = no usable answer · warn = answered but slow/large, or ended without a known reason · info = no answer, expected (the test closed the app) · known = listed in triage.json
  const callLevel = (c) => (c.known ? 'known' : c.issues?.some((i) => i.level === 'fail') ? 'fail' : c.issues?.some((i) => i.level === 'warn') ? 'warn' : c.issues?.some((i) => i.level === 'info') ? 'info' : 'ok');
  const httpChip = (c) => {
    const lv = callLevel(c);
    if (c.error) return `<span class="http sx" title="${esc(c.error)}">NO RESP.</span>`;
    if (c.status == null) return `<span class="http ${lv === 'info' ? 'known' : 'sx'}" title="${esc(c.noResponse ? c.noResponse.reason : '')}">NO RESP.</span>`;
    return `<span class="http s${String(c.status)[0]}${lv === 'known' ? ' known' : ''}" title="${esc(codeMeaning('http', c.status))}">${c.status}</span>`;
  };
  const evTime = (at) => { const m = String(at || '').match(/(\d{2}):(\d{2}):(\d{2})\.(\d{1,3})/); return m ? Date.UTC(2000, 0, 1, m[1], m[2], m[3], Number(m[4].padEnd(3, '0'))) : null; };
  function timelineHtml(c) {
    const t0 = evTime(c.at);
    const rows = (c.events || []).map((e) => {
      const d = t0 != null && evTime(e.at) != null ? '+' + (evTime(e.at) - t0) + ' ms' : '';
      const info = e.kind === 'abandoned' && c.noResponse && c.noResponse.level === 'info' ? ' info' : '';
      return `<tr class="k-${esc(e.kind)}${info}"><td class="t">${esc(String(e.at || '').split(' ').pop())}</td><td class="t">${d}</td><td>${esc(e.text)}</td></tr>`;
    }).join('');
    return `<table class="tl" aria-label="Life of this call">${rows}</table>`;
  }
  function bodyHtml(c) {
    if (c.noResponse || c.status == null) return `<div style="color:${c.noResponse && c.noResponse.level === 'info' ? 'var(--text-2)' : 'var(--critical)'};font-weight:600">No response was received, so there is no body. ${esc(c.noResponse ? c.noResponse.reason : '')}</div>`;
    if (!c.bodyPreview) return `<div class="muted">${esc(c.bodyNote ? (c.shape || c.bodyNote) : (c.bodyMissing || `No body was logged for this ${c.status} response.`))}</div>`;
    const cut = c.bodyPreview.length >= 6000;
    return `<pre class="log" style="max-height:340px">${esc(c.bodyPreview)}${cut ? '\n… first 6,000 characters shown; ' + kb(c.bodyLength) + ' in total' : ''}</pre>${c.bodyFile ? `<div style="margin-top:4px"><a href="${esc(c.bodyFile)}" target="_blank" rel="noopener">Open the full response (${kb(c.bodyLength)})</a></div>` : ''}`;
  }
  // "step 3 · Login" / "after step 3 · Login" / "before step 1 · Onboarding"; long: with the step's title
  const stepWhere = (st, long) => `${st.when === 'after' ? 'after step ' : st.when === 'before' ? 'before step ' : 'step '}${st.n}${long ? ` (${st.title})` : ''} · ${st.screen || 'screen unknown'}${long && st.when === 'after' ? ' — started between this step and the next one' : long && st.when === 'before' ? ' — started before the first step (e.g. while the app was opening)' : ''}`;
  const callId = (testKey, c) => 'call-' + String(testKey || '').replace(/[^A-Za-z0-9_-]/g, '') + '-' + c.seq;
  function callHtml(c, testTitle, open, testKey) {
    const lv = callLevel(c);
    const why = c.known
      ? `<div class="why known">◌ Known issue: ${esc(c.known)} <span class="muted">(${esc(c.issues.map((i) => i.reason).join('; '))})</span></div>`
      : (c.issues || []).filter((i) => !(c.noResponse && i.reason.includes(c.noResponse.reason))).map((i) => `<div class="why ${i.level === 'info' ? 'known' : i.level}">${i.level === 'fail' ? '✖' : i.level === 'warn' ? '⚠' : '◌'} ${esc(i.reason)}</div>`).join('');
    let path = c.url; try { const u = new URL(c.url); path = u.hostname.replace(/^(en\.wikipedia\.org)$/, 'en.wikipedia') + u.pathname + (u.search ? decodeURIComponent(u.search).slice(0, 120) : ''); } catch {}
    const hdrs = (h, which) => Object.keys(h || {}).length ? `<pre class="log" style="max-height:160px">${esc(Object.entries(h).map(([k, v]) => k + ': ' + v).join('\n'))}</pre>` : `<div class="muted">${which === 'response' && (c.noResponse || c.status == null) ? 'None: no response was received.' : `Not in the log: ${esc(c.bodyMissing || c.bodyNote || 'this call was logged without headers (status line only).')}`}</div>`;
    const cid = callId(testKey, c);
    const resCls = c.noResponse || c.status == null ? `nores${c.noResponse && c.noResponse.level === 'info' ? ' info' : ''}` : '';
    return `<details class="call ${lv === 'fail' ? 'fail' : lv === 'warn' ? 'warn' : ''}" id="${esc(cid)}"${open || S.call === cid ? ' open' : ''}>
      <summary><span class="muted mono hide-sm" style="font-size:11px">${esc((c.at || '').split(' ').pop().slice(0, 12))}</span><span class="mono hide-sm" style="font-size:11px">${esc(c.method)}</span>
        <span class="ep" title="${esc(c.url)}">${esc(path)}${testTitle ? `<span class="muted" style="font-family:inherit"> · ${esc(testTitle)}</span>` : ''}${c.step ? `<span class="muted" style="font-family:inherit"> · ${esc(stepWhere(c.step))}</span>` : ''}${c.afterTestEnded ? '<span class="muted" style="font-family:inherit"> · after the test ended</span>' : ''}</span>
        ${httpChip(c)}<span class="num" style="text-align:right;font-variant-numeric:tabular-nums">${c.totalMs != null ? c.totalMs + ' ms' : c.ms != null ? c.ms + ' ms' : '—'}</span><span class="hide-sm" style="text-align:right">${kbShort(c.bytes)}</span>
        <div class="res ${resCls}">${c.noResponse || c.status == null ? '✖ ' : '→ '}${esc(c.resolution || '')}</div>${why}${c.status != null && String(c.status)[0] !== '2' && !(c.issues || []).some((i) => i.reason.includes(' means: ')) ? `<div class="why known">ⓘ ${esc(codeMeaning('http', c.status))}</div>` : ''}</summary>
      <div class="cd">
        <div style="font-weight:600">From request to ${c.noResponse || c.status == null ? 'outcome' : 'response'}</div>${timelineHtml(c)}
        <dl class="kv" style="margin-top:8px"><dt>Request</dt><dd><span class="mono">${esc(c.method)}</span> <a href="${esc(c.url)}" target="_blank" rel="noopener" class="mono" style="word-break:break-all">${esc(c.url)}</a></dd>
          ${c.finalUrl ? `<dt>Redirected to</dt><dd class="mono">${esc(c.finalUrl)}</dd>` : ''}
          <dt>Step</dt><dd>${c.step ? `${esc(stepWhere(c.step, true))}` : `<span class="muted">${esc(c.stepNote || 'Not matched to a step.')}</span>`}</dd>
          <dt>Outcome</dt><dd>${esc(c.resolution || '')}</dd>
          ${c.status != null ? `<dt>Status ${esc(c.status)}</dt><dd>${esc(codeMeaning('http', c.status).replace(/^\d+ /, ''))}</dd>` : ''}
          ${c.shape ? `<dt>Response holds</dt><dd>${esc(c.shape)}</dd>` : ''}
          ${c.format ? `<dt>Format</dt><dd>${c.format.status === 'ok' ? `<span style="color:var(--good)">✓</span> Matches "${esc(c.format.rule)}" in test/api-formats.json (${c.format.checked} values checked)` : c.format.status === 'problems' ? `<b style="color:var(--critical)">✖ ${c.format.problems.length} problem${c.format.problems.length > 1 ? 's' : ''}</b> against "${esc(c.format.rule)}":<ul style="margin:2px 0 0 16px;padding:0">${c.format.problems.slice(0, 12).map((p) => `<li>${esc(p.text)}</li>`).join('')}</ul>` : `<span class="muted">Not checked ("${esc(c.format.rule)}"): ${esc(c.format.reason)}</span>`}</dd>` : ''}
          <dt>API</dt><dd class="mono">${esc(c.endpoint)}</dd>
          ${c.pid ? `<dt>In the app</dt><dd>process ${esc(c.pid)}, thread ${esc(c.thread)}</dd>` : ''}</dl>
        <div style="margin:6px 0"><button class="btn" style="min-height:26px;font-size:12px" data-copy-call="${esc(cid)}">Copy link to this call</button></div>
        <details><summary>Request headers (${Object.keys(c.reqHeaders || {}).length})</summary>${hdrs(c.reqHeaders, 'request')}</details>
        <details><summary>Response headers (${Object.keys(c.resHeaders || {}).length})</summary>${hdrs(c.resHeaders, 'response')}</details>
        <div style="margin-top:8px;font-weight:600">Response body</div>${bodyHtml(c)}
      </div></details>`;
  }

  // Why a run or a test has no API calls: always the concrete reason, never a generic line
  function noCallsReason(run, tests) {
    if (run.setupError) return `No API calls: the run never started (${run.setupError}), so the app was not opened.`;
    const session = tests.find((t) => t.id === 'SESSION');
    if (session) return `No API calls: the test session never started, so the app was not opened. ${session.error ? session.error.message : ''}`;
    if (!tests.length) return runState(run) === 'running' ? 'No API calls yet: the first test has not finished.' : 'No API calls: no test results were recorded in this run.';
    if (run.apiLevel === 'NONE') return run.apiLevelReason || 'No API calls were logged in this run.';
    const lvl = run.apiLevel === 'BODY' ? 'Full API logging was on' : `API logging: ${run.apiLevelReason || 'status lines only'}`;
    return `The app's network log contains no requests during the ${tests.length} test${tests.length === 1 ? '' : 's'} of this run (${fmtDate(run.startedAt)} → ${run.endedAt ? fmtDate(run.endedAt) : 'still running'}). ${lvl}.`;
  }
  const levelLine = (run) => (run.apiLevel === 'BODY' ? 'full requests and responses recorded' : run.apiLevel === 'NONE' ? 'the app logged no API calls' : `status lines only: ${run.apiLevelReason || 'full logging was not switched on'}`);

  // The whole run's API activity as a log, oldest first (the same text as reports/runs/<id>/api-log.txt)
  function apiLogHtml(run) {
    const out = [];
    let n = 0;
    for (const t of run.tests) {
      out.push(`<span class="h">=== ${esc(t.title)}</span>`);
      if (!(t.api || []).length) { out.push(`    No API calls were logged during this test (${t.startedAt ? new Date(t.startedAt).toLocaleTimeString() : '?'} → ${t.finishedAt ? new Date(t.finishedAt).toLocaleTimeString() : '?'}).`, ''); continue; }
      for (const c of t.api) {
        n++;
        const lv = callLevel(c);
        out.push(`<span class="h">#${n}  ${esc(c.method)} ${esc(c.url)}</span>${c.afterTestEnded ? '  [after the test ended]' : ''}`);
        const t0 = evTime(c.at);
        for (const e of c.events || []) {
          const d = t0 != null && evTime(e.at) != null ? ('+' + (evTime(e.at) - t0) + ' ms').padStart(10) : ''.padStart(10);
          const cls = e.kind === 'failed' ? 'f' : e.kind === 'abandoned' ? (c.noResponse && c.noResponse.level === 'info' ? 'i' : 'f') : '';
          out.push(`    ${esc(String(e.at || '').split(' ').pop().padEnd(12))} ${d}  ${cls ? `<span class="${cls}">` : ''}${esc(e.text)}${cls ? '</span>' : ''}`);
        }
        out.push(`    <span class="${lv === 'fail' ? 'f' : lv === 'warn' ? 'w' : lv === 'known' ? 'k' : ''}">=> ${esc(c.resolution || '')}</span>`);
        if (c.shape) out.push(`    Response: ${esc(c.shape)}`);
        if (c.bodyMissing) out.push(`    Body: ${esc(c.bodyMissing)}`);
        for (const i of c.issues || []) if (!(c.noResponse && i.reason.includes(c.noResponse.reason))) out.push(`    <span class="${c.known ? 'k' : i.level === 'fail' ? 'f' : i.level === 'warn' ? 'w' : 'i'}">${c.known ? 'KNOWN' : i.level.toUpperCase()}: ${esc(i.reason)}${c.known ? ' (known: ' + esc(c.known) + ')' : ''}</span>`);
        out.push('');
      }
    }
    return out.join('\n');
  }

  function apiHtml() {
    if (!current) return '<p class="empty">No runs match the filters.</p>';
    const run = (window.DASH_RUNS || {})[current.id];
    if (!run) { loadRun(current.id).then(() => { if (S.tab === 'api') render(); }); return '<p class="empty">Loading the run…</p>'; }
    const all = run.tests.flatMap((t) => (t.api || []).map((c) => Object.assign({}, c, { _test: t.title, _key: t.key })));
    const sum = current.api || {};
    const head = `<h1>API calls · run ${esc(current.id)} <span class="muted" style="font-size:13px;font-weight:400">${esc(buildLabel(current.apk))} · ${esc(verLabel(current.apk))} · ${esc(levelLine(current))}</span></h1>`;
    if (!all.length) return `<div class="page">${head}<section class="card card-b">${esc(noCallsReason(current, run.tests))}</section></div>`;
    const q = S.q.toLowerCase();
    const shown = all.filter((c) => (S.af === 'all' || (S.af === 'failed' && callLevel(c) === 'fail') || (S.af === 'warnings' && callLevel(c) === 'warn') || (S.af === 'known' && callLevel(c) === 'known') || (S.af === 'noresp' && (c.noResponse || c.status == null))) && (!q || `${c.url} ${c.endpoint} ${c._test} ${c.step ? stepWhere(c.step, true) : ''} ${c.status} ${c.resolution} ${(c.issues || []).map((i) => i.reason).join(' ')}`.toLowerCase().includes(q)));
    const byEp = new Map();
    for (const c of all) { if (!byEp.has(c.endpoint)) byEp.set(c.endpoint, { ep: c.endpoint, calls: [] }); byEp.get(c.endpoint).calls.push(c); }
    const eps = [...byEp.values()].map((e) => { const ms = e.calls.map((c) => c.ms).filter((x) => x != null); return Object.assign(e, { fail: e.calls.filter((c) => callLevel(c) === 'fail').length, warn: e.calls.filter((c) => callLevel(c) === 'warn').length, known: e.calls.filter((c) => callLevel(c) === 'known').length, info: e.calls.filter((c) => callLevel(c) === 'info').length, avg: ms.length ? Math.round(ms.reduce((a, b) => a + b, 0) / ms.length) : null, p50: pctl(ms, 50), p95: pctl(ms, 95), max: ms.length ? Math.max(...ms) : null, bytes: e.calls.reduce((n, c) => n + (c.bytes || 0), 0), statuses: [...new Set(e.calls.map((c) => (c.status != null ? c.status : 'no response')))], worst: e.calls.find((c) => callLevel(c) === 'fail') || e.calls.find((c) => callLevel(c) === 'warn') || e.calls.find((c) => c.known) || e.calls.find((c) => callLevel(c) === 'info') }); })
      .sort((a, b) => b.fail - a.fail || b.warn - a.warn || b.calls.length - a.calls.length);
    const problems = all.filter((c) => ['fail', 'warn', 'info'].includes(callLevel(c)));
    const top = sum.topIssues || [];
    const shortReason = (txt) => String(txt || '').replace(/ at \d{2}:\d{2}:\d{2}(\.\d+)?/g, '').replace(/ \(([^)]*)\)/g, '').split(/\. |: /)[0].slice(0, 90);
    const listOf = (lvl) => top.filter((x) => x.level === lvl).map((x) => `${x.count}× ${shortReason(x.reason)} (${x.endpoint.replace(/^\S+ /, '').split('?')[0]})`).slice(0, 3).join(' · ');
    const noResp = all.filter((c) => c.noResponse || c.status == null).length;
    const seg = (f, label, n) => `<button data-af="${f}" aria-pressed="${S.af === f}">${label} <span class="muted">${n}</span></button>`;
    const card = (label, n, sub, color) => `<div class="card card-b" style="border-top:3px solid ${color}"><div class="muted" style="font-size:12px">${label}</div><div style="font-size:24px;font-weight:700">${n}</div><div style="font-size:12px;color:var(--text-2)">${sub}</div></div>`;
    const slowest = all.filter((c) => c.ms != null).sort((a, b) => b.ms - a.ms)[0];
    return tabify(`<div class="page">${head}
      <div class="callsum">
        ${card('Calls', all.length, `${eps.length} different APIs · ${kb(sum.bytes || 0)} received · ${all.filter((c) => c.bodyFile).length} full responses saved`, 'var(--accent)')}
        ${card('Failed', sum.failed || 0, sum.failed ? esc(listOf('fail')) : 'Every call got a usable answer (known issues aside).', sum.failed ? 'var(--critical)' : 'var(--good)')}
        ${card('No response', noResp, noResp ? esc([...new Set(all.filter((c) => c.noResponse || c.status == null).map((c) => (c.noResponse ? shortReason(c.noResponse.reason) : 'no reason in the log')))].slice(0, 3).join(' · ')) : 'Every call was answered.', noResp ? 'var(--critical)' : 'var(--good)')}
        ${card('Warnings', sum.warnings || 0, sum.warnings ? esc(listOf('warn')) : `None over the limits (${'2 s'} / ${'500 KB'}).`, 'var(--warn)')}
        ${card('Known issues', sum.known || 0, sum.known ? esc(top.filter((x) => x.level === 'known').map((x) => x.count + '× ' + x.endpoint.replace(/^\S+ /, '').split('?')[0]).join(' · ')) : 'None of the knownApi rules in test/triage.json matched.', 'var(--skipped)')}
        ${card('Slowest call', slowest ? slowest.ms + ' ms' : '—', slowest ? esc(slowest.endpoint.replace(/^\S+ /, '')) : 'No timings logged.', 'var(--text-2)')}
      </div>
      <!--tab key=problems|label=Problems|badge=${problems.length}|tone=${problems.some((c) => callLevel(c) === 'fail') ? 'bad' : problems.length ? 'warn' : ''}-->${problems.length ? `<section class="card" style="margin-bottom:12px"><div class="card-h"><h2>Problems (${problems.length})</h2><div class="r">each with its reason: the status and server message, the network error, or why no response came</div></div><div class="card-b calls">${problems.map((c) => callHtml(c, c._test, false, c._key)).join('')}</div></section>`
        : `<section class="card card-b" style="margin-bottom:12px">✓ All ${all.length} calls were answered without errors, under ${(sum.slowestMs || 0) + 1} ms each and within the size limit${sum.known ? `; ${sum.known} known issue${sum.known > 1 ? 's' : ''} (grey below)` : ''}.</section>`}
      ${(() => {
        const byScreen = new Map();
        for (const c of all) { const k = c.step ? c.step.screen || 'screen unknown' : 'not matched to a step'; if (!byScreen.has(k)) byScreen.set(k, []); byScreen.get(k).push(c); }
        const q = (a, p) => { const v = a.filter((x) => x != null).sort((x, y) => x - y); return v.length ? v[Math.min(v.length - 1, Math.ceil(p * v.length) - 1)] : null; };
        const rows = [...byScreen.entries()].map(([scr, cs]) => ({ scr, cs, fail: cs.filter((c) => callLevel(c) === 'fail').length, warn: cs.filter((c) => callLevel(c) === 'warn').length, nores: cs.filter((c) => c.noResponse || c.status == null).length, p50: q(cs.map((c) => c.ms), 0.5), p95: q(cs.map((c) => c.ms), 0.95), steps: [...new Set(cs.filter((c) => c.step).map((c) => c._test.split(' ')[0] + ' step ' + c.step.n))] }))
          .sort((a, b) => b.fail - a.fail || b.cs.length - a.cs.length);
        return `<!--tab key=screen|label=By screen|badge=${rows.length}--><section class="card" style="margin-bottom:12px"><div class="card-h"><h2>By screen</h2><div class="r">which screen (and test step) each call was made on · type a screen name in the search to list its calls</div></div><div class="card-b tbl-wrap"><table><thead><tr><th>Screen</th><th class="num">Calls</th><th>Outcome</th><th class="num">p50</th><th class="num">p95</th><th>Steps</th></tr></thead><tbody>
          ${rows.map((r) => `<tr><td><b>${esc(r.scr)}</b></td><td class="num">${r.cs.length}</td><td>${r.fail ? chipSt('NEW', '', r.fail + ' failed') + ' ' : ''}${r.nores ? chipSt('KNOWN', '', r.nores + ' no response') + ' ' : ''}${r.warn ? chipSt('WARNING', '', r.warn + ' warn') : ''}${!r.fail && !r.warn && !r.nores ? chipSt('PASS', '', 'all answered') : ''}</td><td class="num">${r.p50 != null ? r.p50 + ' ms' : '—'}</td><td class="num">${r.p95 != null ? r.p95 + ' ms' : '—'}</td><td class="sub" style="max-width:320px">${esc(r.steps.slice(0, 6).join(', '))}${r.steps.length > 6 ? ' …' : ''}</td></tr>`).join('')}</tbody></table></div></section>`;
      })()}
      <!--tab key=byapi|label=By API|badge=${eps.length}--><section class="card" style="margin-bottom:12px"><div class="card-h"><h2>By API</h2><div class="r">${eps.length} APIs · click one to list its calls</div></div><div class="card-b tbl-wrap"><table><thead><tr><th>API</th><th class="num">Calls</th><th>Status codes</th><th class="num">p50</th><th class="num">p95</th><th class="num">Max</th><th class="num">Data</th><th>Outcome</th></tr></thead><tbody>
        ${eps.map((e) => `<tr class="row" data-api-ep="${esc(e.ep)}"><td class="mono" style="word-break:break-all;min-width:280px">${esc(e.ep)}</td><td class="num">${e.calls.length}</td><td class="mono">${statusList(e.statuses)}</td><td class="num">${e.p50 != null ? e.p50 + ' ms' : '—'}</td><td class="num">${e.p95 != null ? e.p95 + ' ms' : '—'}</td><td class="num">${e.max != null ? e.max + ' ms' : '—'}</td><td class="num">${kbShort(e.bytes)}</td>
          <td>${e.fail ? chipSt('NEW', '', e.fail + ' failed') : ''}${e.warn ? ' ' + chipSt('WARNING', '', e.warn + ' warn') : ''}${e.known ? ' ' + chipSt('KNOWN', '', e.known + ' known') : ''}${e.info ? ' ' + chipSt('KNOWN', '', e.info + ' cut off by the test') : ''}${!e.fail && !e.warn && !e.known && !e.info ? chipSt('PASS', '', 'all answered') : ''}
          <div class="sub">${esc(e.worst ? (e.worst.known ? 'Known: ' + e.worst.known : (e.worst.issues[0] || {}).reason || e.worst.resolution) : e.calls[e.calls.length - 1].resolution)}</div></td></tr>`).join('')}</tbody></table></div></section>
      ${(() => { const seen = [...new Set(all.map((c) => c.status).filter((x) => x != null))].sort((a, b) => a - b); const apiCodes = codesFound(all.flatMap((c) => (c.issues || []).map((i) => i.reason)).join(' '), ['4', '5', '3', '2', '1']); return seen.length || apiCodes.length ? `<!--tab key=codes|label=Codes explained--><section class="card" style="margin-bottom:12px"><div class="card-h"><h2>Codes in this run</h2><div class="r">what each code means</div></div><div class="card-b"><table><tbody>${seen.map((st) => `<tr><td class="mono" style="width:70px"><span class="http s${String(st)[0]}" title="${esc(codeMeaning('http', st))}">${st}</span></td><td>${esc(codeMeaning('http', st).replace(/^\d+ /, ''))}</td><td class="num">${all.filter((c) => c.status === st).length}×</td></tr>`).join('')}${apiCodes.map((l) => `<tr><td class="mono">${esc(l.split(':')[0].replace(/^API error /, ''))}</td><td>${esc(l.slice(l.indexOf(':') + 2))}</td><td></td></tr>`).join('')}</tbody></table></div></section>` : ''; })()}
      <!--tab key=calls|label=Every call|badge=${all.length}--><section class="card" style="margin-bottom:12px"><div class="tbar"><h2>Every call, in order</h2><div class="seg" role="group" aria-label="Show calls">${seg('all', 'All', all.length)}${seg('failed', 'Failed', all.filter((c) => callLevel(c) === 'fail').length)}${seg('noresp', 'No response', noResp)}${seg('warnings', 'Warnings', all.filter((c) => callLevel(c) === 'warn').length)}${seg('known', 'Known', all.filter((c) => callLevel(c) === 'known').length)}</div><span class="muted" style="font-size:12px;margin-left:auto">open a call for its timeline, headers and response</span></div>
        <div class="card-b calls">${shown.length ? shown.map((c) => callHtml(c, c._test, false, c._key)).join('') : `<p class="empty">None of the ${all.length} calls ${S.af === 'all' ? '' : `is in "${{ failed: 'Failed', noresp: 'No response', warnings: 'Warnings', known: 'Known' }[S.af]}"`}${q ? ` matches "${esc(S.q)}"` : ''}.</p>`}</div></section>
      <!--tab key=log|label=API log--><section class="card" style="margin-bottom:40px"><div class="card-h"><h2>API log · initiation to resolution</h2><div class="r">${current.apiLog ? `<a href="${esc(current.apiLog)}" target="_blank" rel="noopener">api-log.txt</a> (same log as a file)` : ''}</div></div>
        <div class="card-b"><div class="muted" style="font-size:12px;margin-bottom:6px">Every call of the run in order, test by test: when it started, was sent, got its headers and body, or why it got no response. Times are the emulator's clock; +ms counts from the start of each call.</div><div class="apilog">${apiLogHtml(run)}</div></div></section><!--/tabs--></div>`, S.af !== 'all' || S.q ? 'calls' : problems.length ? 'problems' : 'screen', 'API calls page');
  }

  // ---------------------------------------------------------------- Unit tests (npm run test:unit): the project's own code, no device
  // Data: data/unit.js (written by test/support/dashboard/unit-report.mjs), loaded when this tab is opened.
  let unitLoading = null;
  const UST = { passed: ['✓', 'Passed', 'PASS'], failed: ['✖', 'Failed', 'NEW'], cancelled: ['✖', 'Cancelled', 'NEW'], skipped: ['–', 'Skipped', 'KNOWN'], todo: ['–', 'To do', 'KNOWN'], absent: ['·', 'Not in this run', 'KNOWN'] };
  const uChip = (st) => chipSt(UST[st][2], '', `${UST[st][0]} ${UST[st][1]}`);
  const uId = (key) => 'ut-' + [...key].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);
  // file:///C:/x/y.js:12:5 and /x/y.js:12:5 in a stack trace -> links that open the line in VS Code
  const stackHtml = (s) => esc(s).replace(/(file:\/\/\/?)?((?:[A-Za-z]:)?[\/\\][^\s():]+?\.(?:m?js|cjs|ts)):(\d+):(\d+)/g, (m, f, p, l, c) => /node_modules|node:/.test(p) ? m : `<a href="vscode://file/${p.replace(/\\/g, '/').replace(/^\//, '')}:${l}:${c}">${m}</a>`);
  function unitHtml() {
    if (!window.DASH_UNIT) {
      if (!unitLoading) unitLoading = loadScript('data/unit.js').then(() => { window.DASH_UNIT = window.DASH_UNIT || { runs: [] }; unitLoading = null; if (S.tab === 'unit') render(); });
      return '<div class="page"><p class="empty">Loading the unit test results…</p></div>';
    }
    const runs = window.DASH_UNIT.runs || [];
    if (!runs.length) return `<div class="page"><h1>Unit tests</h1><section class="card card-b">No unit test results yet. Run <code>npm run test:unit</code> (or <code>npm run test:unit:coverage</code> for coverage too): the results appear here by themselves. Unit tests check the project's own code (page objects, layout checker, recorder, scripts) without a device.</section></div>`;
    const run = runs.find((r) => r.id === S.urun) || runs[0];
    // compared with the previous run of the same command (npm run test:unit vs test:unit:coverage vs the error demo)
    const prev = runs.slice(runs.indexOf(run) + 1).find((r) => r.command === run.command) || null;
    const s = run.summary, cov = run.coverage, P = prev ? prev.summary : null;
    const q = S.q.toLowerCase();
    const match = (t) => !q || `${t.name} ${t.file} ${t.suite.join(' ')} ${t.messages.join(' ')} ${t.error ? t.error.message : ''}`.toLowerCase().includes(q);
    const hist = (key) => runs.slice(0, 20).map((r) => { const x = r.tests.find((y) => y.key === key); return { id: r.id, st: x ? x.status : 'absent' }; });
    const unstable = new Set(run.tests.filter((t) => { const h = hist(t.key).map((x) => x.st); return h.includes('passed') && h.includes('failed'); }).map((t) => t.key));
    const fixedNow = prev ? run.tests.filter((t) => t.status === 'passed' && (prev.tests.find((y) => y.key === t.key) || {}).status === 'failed').length : 0;
    const newFail = (t) => t.status === 'failed' && prev && (prev.tests.find((y) => y.key === t.key) || {}).status !== 'failed';

    // ---- verdict and numbers
    const V = run.status === 'failed' ? ['BLOCKED', '■', 'FAILED'] : run.status === 'coverage' ? ['UNSTABLE', '≈', 'COVERAGE LOW'] : ['PASS', '✓', 'PASS'];
    const why = run.status === 'failed' ? `${s.failed} of ${s.total} unit tests failed${run.tests.filter(newFail).length ? ` (${run.tests.filter(newFail).length} new since the last run)` : ''}` : run.status === 'coverage' ? `All tests passed, but line coverage ${cov.totals.lines.toFixed(1)}% is under the ${cov.threshold}% limit` : `All ${s.passed} unit tests passed${s.skipped ? `, ${s.skipped} skipped` : ''}`;
    const delta = (a, b, goodIsUp, unit = '') => { if (b == null) return '<span class="d">no earlier run</span>'; const d = Math.round((a - b) * 10) / 10; if (!d) return '<span class="d">= last run</span>'; const bad = goodIsUp ? d < 0 : d > 0; return `<span class="d ${bad ? 'bad' : 'good'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit} vs last</span>`; };
    const kpi = (sec, label, val, d, color, alert) => `<button class="kpi${alert ? ' alert' : ''}" style="--c:${color}" data-usec="${sec}"><div class="l">${label}</div><div class="n">${val}</div>${d}</button>`;
    const covL = cov && cov.totals.lines != null ? Math.round(cov.totals.lines * 10) / 10 : null, covP = prev && prev.coverage && prev.coverage.totals.lines != null ? Math.round(prev.coverage.totals.lines * 10) / 10 : null;
    const head = `<section class="verdict" aria-label="Unit test verdict">
      <div class="vbox ${V[0]}" role="status"><div class="v"><span aria-hidden="true">${V[1]}</span>${V[2]}</div><div class="why">${esc(why)}</div>
        <div class="run">unit run ${esc(run.id)} · ${esc(run.command)} · ${esc(fmtDate(run.startedAt))}</div>
        <button class="vlink" data-usec="details">Run details: ${esc((run.details && run.details.trigger) || 'manual')}${run.details && run.details.project && run.details.project.branch ? ' · ' + esc(run.details.project.branch) : ''} ›</button></div>
      <div class="kpis">
        ${kpi('tests', 'Tests', s.total, delta(s.total, P && P.total, true), 'var(--accent)')}
        ${kpi('tests', 'Passed', s.passed, delta(s.passed, P && P.passed, true), 'var(--good)')}
        ${kpi('failures', 'Failed', s.failed, delta(s.failed, P && P.failed, false), 'var(--critical)', s.failed > 0)}
        ${kpi('tests', 'Skipped', s.skipped, delta(s.skipped, P && P.skipped, false), 'var(--skipped)')}
        ${kpi('history', 'Unstable', unstable.size, `<span class="d">${fixedNow ? fixedNow + ' fixed since last' : 'passed and failed'}</span>`, 'var(--warn)', unstable.size > 0)}
        ${kpi('history', 'Duration', dur(s.durationMs), delta(Math.round(s.durationMs / 100) / 10, P && Math.round(P.durationMs / 100) / 10, false, ' s'), 'var(--text-2)')}
        ${kpi('coverage', 'Line coverage', covL != null ? covL + '%' : '—', covL != null ? (cov.threshold ? `<span class="d ${cov.belowThreshold ? 'bad' : 'good'}">limit ${cov.threshold}%${covP != null ? ' · ' + (covL - covP >= 0 ? '▲ ' : '▼ ') + Math.abs(Math.round((covL - covP) * 10) / 10) + ' pts' : ''}</span>` : delta(covL, covP, true, ' pts')) : '<span class="d">run test:unit:coverage</span>', 'var(--accent)', cov && cov.belowThreshold)}
      </div></section>`;

    // ---- one test, with everything about it
    const testRow = (t, open) => {
      const e = t.error;
      const h = hist(t.key);
      return `<details class="ut ${t.status}" id="${uId(t.key)}"${open ? ' open' : ''}>
        <summary>${uChip(t.status)}<span class="un">${esc(t.name)}${newFail(t) ? ' <span class="chip st-NEW">NEW</span>' : ''}${unstable.has(t.key) ? ' <span class="chip st-FLAKY">≈ unstable</span>' : ''}${t.suite.length ? `<span class="muted"> · ${esc(t.suite.join(' › '))}</span>` : ''}</span>

            ${e.expected !== undefined ? `<div class="uexp"><div><b>Expected</b><pre class="log">${esc(e.expected)}</pre></div><div><b>Actual</b><pre class="log">${esc(e.actual)}</pre></div></div>${e.operator ? `<div class="muted" style="font-size:12px">Compared with <code>assert.${esc(e.operator)}</code></div>` : ''}` : ''}
            ${e.location ? `<div class="links"><span class="muted" style="font-size:12px">Where it failed (opens in VS Code):</span><a href="${esc(e.location.href)}">${esc(e.location.file)}:${e.location.line}</a></div>` : ''}
            ${codeNotes(e.message)}
            ${e.stack ? `<details><summary>Stack trace</summary><pre class="log">${stackHtml(e.stack)}</pre></details>` : ''}</div>` : ''}
          ${t.skipReason ? `<div class="muted">Skipped: ${esc(t.skipReason)}</div>` : ''}
          ${t.messages.length ? `<div style="margin-top:6px"><b>Messages from the test</b> <span class="muted" style="font-size:12px">(data it checked: API calls and bodies, what the pretend phone did, what the checker said)</span><pre class="log">${esc(t.messages.join('\n'))}</pre></div>` : ''}
          <dl class="kv"><dt>Test</dt><dd>${t.href ? `<a href="${esc(t.href)}">${esc(t.file)}:${t.line}</a> <span class="muted">(opens in VS Code)</span>` : esc(t.file)}</dd>
            ${t.suite.length ? `<dt>Group</dt><dd>${esc(t.suite.join(' › '))}</dd>` : ''}<dt>Time</dt><dd>${dur(t.durationMs)}</dd>
            <dt>History</dt><dd><div class="dots" aria-label="Results in the last ${h.length} unit runs, newest first">${h.map((x) => `<a class="dot ${x.st === 'passed' ? 'passed' : x.st === 'failed' || x.st === 'cancelled' ? 'failed' : 'skipped'}${x.id === run.id ? ' cur' : ''}" href="#" data-urun="${esc(x.id)}" title="${esc(x.id + ': ' + UST[x.st][1])}" aria-label="${esc(x.id + ': ' + UST[x.st][1])}"></a>`).join('')}</div>
              <div class="muted" style="font-size:12px">${h.filter((x) => x.st === 'failed').length}/${h.length} of the last runs failed${unstable.has(t.key) ? ' · unstable: passed and failed' : ''} · newest first</div></dd></dl>
        </div></details>`;
    };

    // ---- tabs
    const failures = run.tests.filter((t) => (t.status === 'failed' || t.status === 'cancelled') && match(t));
    const shown = run.tests.filter((t) => match(t) && (S.uf === 'all' || (S.uf === 'failed' ? t.status === 'failed' || t.status === 'cancelled' : S.uf === 'skipped' ? t.status === 'skipped' || t.status === 'todo' : t.status === S.uf)));
    const seg = (f, label, n) => `<button data-uf="${f}" aria-pressed="${S.uf === f}">${label} <span class="muted">${n}</span></button>`;
    const byFile = run.files.map((f) => ({ f, tests: shown.filter((t) => t.file === f.file) })).filter((x) => x.tests.length);
    const failuresHtml = failures.length ? `<div class="toolbar" style="margin:0 0 6px"><span class="muted" style="font-size:12px">${failures.length} failed · the first is open; every row shows its error · Enter or click opens one</span>${failures.length > 1 ? '<button class="btn" data-uopen="1" style="margin-left:auto">Open all</button>' : ''}</div>` + failures.map((t, i) => testRow(t, i === 0)).join('') : `<section class="card card-b">✓ No failed unit tests in this run${q ? ' matching the search' : ''}.${prev && prev.summary.failed ? ` The last run had ${prev.summary.failed} failed.` : ''}</section>`;
    const testsHtml = `<div class="toolbar" style="margin:0 0 8px"><div class="seg" role="group" aria-label="Show">${seg('all', 'All', run.tests.filter(match).length)}${seg('failed', 'Failed', run.tests.filter((t) => match(t) && (t.status === 'failed' || t.status === 'cancelled')).length)}${seg('passed', 'Passed', run.tests.filter((t) => match(t) && t.status === 'passed').length)}${seg('skipped', 'Skipped', run.tests.filter((t) => match(t) && (t.status === 'skipped' || t.status === 'todo')).length)}</div><span class="muted" style="font-size:12px">${q ? `search: "${esc(S.q)}" · ` : ''}type in the search box to find a test, a file or a message</span></div>
      ${byFile.length ? byFile.map(({ f, tests }) => `<details class="ufileg card"${tests.some((t) => t.status === 'failed') || q || S.uf !== 'all' || byFile.length === 1 ? ' open' : ''}><summary><b class="mono">${esc(f.file)}</b><span class="muted">${tests.length} test${tests.length === 1 ? '' : 's'}${f.failed ? '' : ' · all passed'}</span>${tests.some((t) => t.status === 'failed') ? chipSt('NEW', '', tests.filter((t) => t.status === 'failed').length + ' failed') : ''}<span class="num muted">${dur(f.durationMs)}</span></summary><div class="ufiles">${tests.map((t) => testRow(t, false)).join('')}</div></details>`).join('') : '<p class="empty">No tests match.</p>'}`;
    const covHtml = !cov ? `<section class="card card-b">No coverage in this run. <code>npm run test:unit:coverage</code> runs the same tests and records which lines of the project's code they ran (and fails if line coverage drops under the limit).</section>`
      : `<div class="callsum">${[['Lines', cov.totals.lines], ['Branches', cov.totals.branches], ['Functions', cov.totals.functions]].map(([l, v]) => `<div class="card card-b" style="border-top:3px solid ${l === 'Lines' && cov.belowThreshold ? 'var(--critical)' : 'var(--accent)'}"><div class="muted" style="font-size:12px">${l} covered</div><div style="font-size:24px;font-weight:700">${v != null ? v.toFixed(1) + '%' : '—'}</div><div style="font-size:12px;color:var(--text-2)">${l === 'Lines' ? (cov.threshold ? `${cov.belowThreshold ? '✖ under' : '✓ over'} the ${cov.threshold}% limit · ${cov.totals.lineCount} lines` : `${cov.totals.lineCount} lines`) : l === 'Branches' ? 'both sides of each if / ?: run' : 'functions called at least once'}</div></div>`).join('')}</div>
        <section class="card"><div class="card-h"><h2>Per file</h2><div class="r">lowest first · "uncovered" = line numbers no unit test ran</div></div><div class="card-b tbl-wrap"><table><thead><tr><th>File</th><th class="num">Lines</th><th class="num hide-sm">Branches</th><th class="num hide-sm">Functions</th><th class="hide-sm">Uncovered lines</th></tr></thead><tbody>
          ${cov.files.map((f) => `<tr><td class="mono" style="word-break:break-all">${esc(f.file)}<div class="covbar" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, f.lines))}%"></i></div></td><td class="num"><b style="color:${f.lines < 50 ? 'var(--critical)' : f.lines < 75 ? 'var(--warn-text)' : 'inherit'}">${f.lines.toFixed(1)}%</b></td><td class="num hide-sm">${f.branches.toFixed(1)}%</td><td class="num hide-sm">${f.functions.toFixed(1)}%</td><td class="mono hide-sm" style="font-size:11.5px;max-width:360px;word-break:break-word">${esc(f.uncovered.length > 160 ? f.uncovered.slice(0, 160) + ' …' : f.uncovered) || '<span class="muted">none</span>'}</td></tr>`).join('')}</tbody></table></div></section>`;
    const slow = [...run.tests].sort((a, b) => b.durationMs - a.durationMs).slice(0, 8);
    const histHtml = `<section class="card" style="margin-bottom:12px"><div class="card-h"><h2>Unit runs</h2><div class="r">${runs.length} kept · click one to open it</div></div><div class="card-b tbl-wrap"><table><thead><tr><th>Run</th><th>Result</th><th class="num">Tests</th><th class="num">Failed</th><th class="num hide-sm">Coverage</th><th class="num hide-sm">Duration</th><th class="hide-sm">Test code</th></tr></thead><tbody>
        ${runs.map((r) => `<tr class="row${r.id === run.id ? ' sel' : ''}" data-urun="${esc(r.id)}"><td class="mono">${esc(r.id)}<div class="sub">${esc(fmtDate(r.startedAt))} · ${esc(r.command)}</div></td><td>${r.status === 'failed' ? chipSt('NEW', '', '✖ failed') : r.status === 'coverage' ? chipSt('WARNING', '', 'coverage low') : chipSt('PASS', '', '✓ passed')}</td><td class="num">${r.summary.total}</td><td class="num">${r.summary.failed}</td><td class="num hide-sm">${r.coverage && r.coverage.totals.lines != null ? r.coverage.totals.lines.toFixed(1) + '%' : '—'}</td><td class="num hide-sm">${dur(r.summary.durationMs)}</td><td class="mono hide-sm">${esc(r.details && r.details.project && r.details.project.commit ? r.details.project.commit.slice(0, 7) + (r.details.project.dirty ? ' + edits' : '') : '—')}</td></tr>`).join('')}</tbody></table></div></section>
      <div class="grid2"><section class="card"><div class="card-h"><h2>Unstable tests (${unstable.size})</h2><div class="r">passed and failed in the kept runs</div></div><div class="card-b">${unstable.size ? `<ul>${[...unstable].map((k) => `<li><a href="#${uId(k)}" data-ukey="${esc(k)}">${esc(k)}</a></li>`).join('')}</ul>` : '<span class="muted">None: every test gave the same result in every kept run (or changed for good).</span>'}</div></section>
        <section class="card"><div class="card-h"><h2>Slowest tests</h2><div class="r">this run</div></div><div class="card-b"><table><tbody>${slow.map((t) => `<tr><td><a href="#${uId(t.key)}" data-ukey="${esc(t.key)}">${esc(t.name)}</a><div class="sub mono">${esc(t.file)}</div></td><td class="num">${dur(t.durationMs)}</td></tr>`).join('')}</tbody></table></div></section></div>`;
    const outFiles = run.files.filter((f) => f.stdout.length || f.stderr.length);
    const outHtml = outFiles.length ? outFiles.map((f) => `<details class="ufileg card"><summary><b class="mono">${esc(f.file)}</b><span class="muted">${f.stdout.length} output line(s)${f.stderr.length ? ` · <b style="color:var(--critical)">${f.stderr.length} error line(s)</b>` : ''}</span></summary><div class="card-b">${f.stderr.length ? `<div style="color:var(--critical);font-weight:600">Errors (stderr)</div><pre class="log">${esc(f.stderr.join('\n'))}</pre>` : ''}${f.stdout.length ? `<div style="font-weight:600">Output (stdout)</div><pre class="log">${esc(f.stdout.join('\n'))}</pre>` : ''}</div></details>`).join('') : '<section class="card card-b">No test file wrote to the console in this run.</section>';
    const d = run.details || {}, pj = d.project || {};
    const detailsHtml = `<section class="card card-b"><dl class="kv">
        <dt>Command</dt><dd class="mono">${esc(run.command)}</dd><dt>Started</dt><dd>${esc(fmtDate(run.startedAt))} · took ${dur(s.durationMs)}</dd>
        <dt>Result</dt><dd>${s.passed} passed · ${s.failed} failed · ${s.skipped} skipped${cov && cov.threshold ? ` · coverage limit ${cov.threshold}%` : ''}</dd>
        <dt>Test code</dt><dd>${pj.commit ? `<span class="mono">${esc(pj.commit.slice(0, 10))}</span>${pj.dirty ? ' <b>with uncommitted changes</b>' : ''}${pj.commitMessage ? ' · ' + esc(pj.commitMessage) : ''}` : 'not a git checkout'}${pj.branch ? ' · branch ' + esc(pj.branch) : ''}</dd>
        <dt>Trigger</dt><dd>${esc(d.trigger || '—')}${d.startedBy ? ' · ' + esc(d.startedBy) : ''}</dd>
        <dt>Computer</dt><dd>${esc([d.host && d.host.name, d.host && d.host.os].filter(Boolean).join(' · ') || '—')}</dd>
        <dt>Node.js</dt><dd>${esc((d.tools && d.tools.node) || '—')} (node:test)</dd>
        <dt>Test files</dt><dd>${run.files.length}: ${run.files.map((f) => esc(f.file)).join(', ')}</dd></dl></section>`;
    return tabify(`<div class="page">${head}
      <div class="toolbar" style="margin:4px 0"><h1 style="margin:0">Unit tests</h1><label class="f"><span>Unit run</span><select id="u-run" aria-label="Unit run">${runs.map((r) => `<option value="${esc(r.id)}"${r.id === run.id ? ' selected' : ''}>${esc(r.id)} · ${r.status === 'failed' ? r.summary.failed + ' failed' : r.status === 'coverage' ? 'coverage low' : 'passed'}</option>`).join('')}</select></label><span class="muted" style="font-size:12px">the project's own code, no device · <code>npm run test:unit</code></span></div>
      <!--tab key=failures|label=Failures|badge=${failures.length ? failures.length + ' failed' : 'none'}|tone=${failures.length ? 'bad' : ''}-->${failuresHtml}
      <!--tab key=tests|label=All tests|badge=${run.tests.length}-->${testsHtml}
      <!--tab key=coverage|label=Coverage|badge=${covL != null ? covL + '%' : 'not run'}|tone=${cov && cov.belowThreshold ? 'bad' : ''}-->${covHtml}
      <!--tab key=history|label=History|badge=${runs.length} runs-->${histHtml}
      <!--tab key=output|label=Console output|badge=${outFiles.reduce((a, f) => a + f.stdout.length + f.stderr.length, 0)} lines-->${outHtml}
      <!--tab key=details|label=Run details-->${detailsHtml}<!--/tabs--></div>`, failures.length ? 'failures' : 'tests', 'Unit test sections');
  }

  // ---------------------------------------------------------------- Compare two runs (or builds)
  function compareHtml() {
    const runs = idx.runs.filter((r) => r.summary.total > 0 || r.setupError);
    if (runs.length < 2) return `<div class="page"><h1>Compare runs</h1><section class="card card-b">Comparing needs at least two runs; there ${runs.length === 1 ? 'is 1' : 'are ' + runs.length} kept.</section></div>`;
    const B = idx.runs.find((r) => r.id === S.b) || current || runs[0];
    const A = idx.runs.find((r) => r.id === S.a) || idx.runs.slice(idx.runs.indexOf(B) + 1).find((r) => suiteKey(r) === suiteKey(B)) || idx.runs.find((r) => r !== B);
    const ra = (window.DASH_RUNS || {})[A.id], rb = (window.DASH_RUNS || {})[B.id];
    if (!ra || !rb) { Promise.all([loadRun(A.id), loadRun(B.id)]).then(() => { if (S.tab === 'compare') render(); }); return '<p class="empty">Loading both runs…</p>'; }
    const opt = (sel) => idx.runs.map((r) => `<option value="${esc(r.id)}"${r.id === sel ? ' selected' : ''}>${esc(r.id)} · ${esc(buildLabel(r.apk))} · ${esc(suiteKey(r))} · ${esc(runState(r))}</option>`).join('');
    const name = (t) => (t.id && t.id !== 'SESSION' ? t.id : t.title);
    const mapA = new Map(ra.tests.map((t) => [name(t), t])), mapB = new Map(rb.tests.map((t) => [name(t), t]));
    const failed = (t) => t && (t.state === 'failed' || t.crash);
    const newly = [], fixed = [], still = [], added = [], removed = [], slower = [], faster = [];
    for (const [k, tb] of mapB) {
      const ta = mapA.get(k);
      if (!ta) { added.push(tb); continue; }
      if (failed(tb) && !failed(ta)) newly.push([ta, tb]);
      else if (!failed(tb) && failed(ta)) fixed.push([ta, tb]);
      else if (failed(tb) && failed(ta)) still.push([ta, tb]);
      if (ta.durationMs > 1000 && tb.durationMs > 1000) { const d = (tb.durationMs - ta.durationMs) / ta.durationMs; if (d > 0.3 && tb.durationMs - ta.durationMs > 1000) slower.push([ta, tb, d]); if (d < -0.3 && ta.durationMs - tb.durationMs > 1000) faster.push([ta, tb, d]); }
    }
    for (const [k, ta] of mapA) if (!mapB.has(k)) removed.push(ta);
    const firstLine = (t) => (t.error ? t.error.message.split('\n')[0] : t.crash ? 'app crash' : '');
    const AB = analyse(B, idx.runs.filter((r) => suiteKey(r) === suiteKey(B)));
    const catOf = (t) => { const x = AB && AB.tests.find((y) => y.T.name === name(t)); return x ? chipCat(x.category, x.categoryWhy) + (x.st === 'REGRESSION' ? ' ' + chipSt('REGRESSION') : '') : chipCat(t.category, t.categoryWhy); };
    const tlink = (r, t) => `<a href="#/triage?run=${encodeURIComponent(r.id)}&f=all&open=${encodeURIComponent('t:' + name(t))}">${esc(t.title)}</a>`;
    const list = (title, items, fn, empty) => `<section class="card" style="margin-bottom:12px"><div class="card-h"><h2>${title} (${items.length})</h2></div><div class="card-b">${items.length ? `<ul style="margin:0;padding-left:18px">${items.map(fn).join('')}</ul>` : `<div class="muted">${empty}</div>`}</div></section>`;
    // metrics
    const m = (label, va, vb, unit = '', goodUp = false, fmt = (x) => x) => {
      const d = va != null && vb != null ? Math.round((vb - va) * 10) / 10 : null;
      const cls = d == null || d === 0 || goodUp === null ? '' : (d > 0) === goodUp ? 'down' : 'up';
      return `<tr><td>${label}</td><td class="num a">${va == null ? '—' : fmt(va) + unit}</td><td class="num b">${vb == null ? '—' : fmt(vb) + unit}</td><td class="num ${cls}">${d == null ? '' : d === 0 ? '=' : (d > 0 ? '+' : '') + fmt(d) + unit}</td></tr>`;
    };
    const sa = A.summary, sb = B.summary, pa = A.perf || {}, pb = B.perf || {}, aa = A.api || {}, ab = B.api || {};
    // API by endpoint
    const epStats = (r) => { const mm = new Map(); for (const t of r.tests) for (const c of t.api || []) { if (!mm.has(c.endpoint)) mm.set(c.endpoint, { n: 0, fail: 0, statuses: new Set(), ms: [] }); const e = mm.get(c.endpoint); e.n++; if (callLevel(c) === 'fail') e.fail++; e.statuses.add(c.status != null ? c.status : 'no response'); if (c.ms != null) e.ms.push(c.ms); } return mm; };
    const ea = epStats(ra), eb = epStats(rb);
    const eps = [...new Set([...ea.keys(), ...eb.keys()])];
    const avg = (x) => (x && x.ms.length ? Math.round(x.ms.reduce((p, q) => p + q, 0) / x.ms.length) : null);
    const epRows = eps.map((ep) => { const x = ea.get(ep), y = eb.get(ep); const change = !x ? 'new in B' : !y ? 'not called in B' : x.fail !== y.fail ? `failures ${x.fail} → ${y.fail}` : [...x.statuses].join() !== [...y.statuses].join() ? `status ${[...x.statuses].join('/')} → ${[...y.statuses].join('/')}` : avg(x) && avg(y) && Math.abs(avg(y) - avg(x)) > Math.max(200, avg(x) * 0.5) ? `avg ${avg(x)} → ${avg(y)} ms` : ''; return { ep, x, y, change }; })
      .sort((p, q) => (q.change ? 1 : 0) - (p.change ? 1 : 0));
    const da = A.details || {}, db = B.details || {};
    const diffRow = (label, va, vb) => `<tr class="${String(va) !== String(vb) ? 'chg' : ''}"><td class="muted">${label}</td><td>${esc(va ?? '—')}</td><td>${esc(vb ?? '—')}</td></tr>`;
    const repo = repoOf(B.apk);
    return tabify(`<div class="page"><h1>Compare runs</h1>
      <div class="toolbar" style="margin-top:0"><label class="f"><span>A (before)</span><select data-cmp="a" aria-label="Run A">${opt(A.id)}</select></label><span aria-hidden="true">→</span><label class="f"><span>B (after)</span><select data-cmp="b" aria-label="Run B">${opt(B.id)}</select></label>
        ${suiteKey(A) !== suiteKey(B) ? `<span class="chip st-WARNING">different suites: ${esc(suiteKey(A))} vs ${esc(suiteKey(B))}</span>` : ''}</div>
      <!--tab key=numbers|label=Numbers and what changed--><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
        <section class="card"><div class="card-h"><h2>Numbers</h2></div><div class="card-b tbl-wrap"><table class="cmp"><thead><tr><th></th><th class="num">A</th><th class="num">B</th><th class="num">Change</th></tr></thead><tbody>
          ${m('Tests', sa.total, sb.total, '', null)}${m('Passed', sa.passed, sb.passed, '', true)}${m('Failed', sa.failed, sb.failed)}${m('Pass rate', pct(sa.total - sa.failed, sa.total), pct(sb.total - sb.failed, sb.total), '%', true)}
          ${m('With warnings', sa.withWarnings, sb.withWarnings)}${m('Duration', A.durationMs != null ? Math.round(A.durationMs / 1000) : null, B.durationMs != null ? Math.round(B.durationMs / 1000) : null, ' s')}
          ${m('API calls', aa.calls, ab.calls, '', null)}${m('API failed', aa.failed, ab.failed)}${m('Slowest API call', aa.slowestMs, ab.slowestMs, ' ms')}
          ${m('App start', pa.launchMs, pb.launchMs, ' ms')}${m('Peak memory', pa.memoryMaxMb, pb.memoryMaxMb, ' MB')}${m('Janky frames', pa.jankyPct, pb.jankyPct, '%')}
        </tbody></table></div></section>
        <section class="card"><div class="card-h"><h2>What changed around the tests</h2></div><div class="card-b tbl-wrap"><table class="diff"><thead><tr><th></th><th>A</th><th>B</th></tr></thead><tbody>
          ${diffRow('App build', buildLabel(A.apk) + ' · ' + verLabel(A.apk), buildLabel(B.apk) + ' · ' + verLabel(B.apk))}
          ${diffRow('App commit', shortC(A.apk.commit), shortC(B.apk.commit))}
          ${diffRow('Test code', da.project ? shortC(da.project.commit) + (da.project.dirty ? ' + local edits' : '') : 'not recorded', db.project ? shortC(db.project.commit) + (db.project.dirty ? ' + local edits' : '') : 'not recorded')}
          ${diffRow('Suite', suiteKey(A), suiteKey(B))}${diffRow('Device', devName(A.device), devName(B.device))}
          ${diffRow('Trigger', da.trigger, db.trigger)}${diffRow('Appium / driver', da.tools && da.tools.appium ? da.tools.appium + ' / ' + (da.tools.uiautomator2Driver || '?') : 'not recorded', db.tools && db.tools.appium ? db.tools.appium + ' / ' + (db.tools.uiautomator2Driver || '?') : 'not recorded')}
          ${diffRow('API logging', A.apiLevel || 'BASIC', B.apiLevel || 'BASIC')}
        </tbody></table>${repo && A.apk.commit && B.apk.commit && A.apk.commit !== B.apk.commit ? `<div style="margin-top:6px"><a href="${esc(repo)}/compare/${esc(A.apk.commit)}...${esc(B.apk.commit)}" target="_blank" rel="noopener">App code changes between A and B on GitHub</a></div>` : A.apk.commit === B.apk.commit ? '<div class="muted" style="margin-top:6px">Same app commit in both runs: differences come from the test code, the device or chance.</div>' : ''}</div></section>
      </div>
      <!--tab key=tests|label=Tests|badge=${newly.length} new · ${fixed.length} fixed|tone=${newly.length ? 'bad' : ''}-->${list('Newly failing in B', newly, ([ta, tb]) => `<li>${tlink(B, tb)} <span class="sub err">${esc(firstLine(tb))}</span>${' ' + catOf(tb)}</li>`, 'No test that passed in A fails in B.')}
      ${list('Fixed in B', fixed, ([ta, tb]) => `<li>${tlink(B, tb)} <span class="muted">failed in A: ${esc(firstLine(ta))}</span></li>`, 'No test that failed in A passes in B.')}
      ${list('Failing in both', still, ([ta, tb]) => `<li>${tlink(B, tb)} <span class="muted">${ta.sig && ta.sig === tb.sig ? 'same error' : 'different error: was "' + esc(firstLine(ta)) + '"'}</span> <span class="sub err">${esc(firstLine(tb))}</span></li>`, 'No test failed in both runs.')}
      ${added.length || removed.length ? list('Tests added or removed', [...added.map((t) => ['added', t]), ...removed.map((t) => ['removed', t])], ([k, t]) => `<li>${k === 'added' ? 'Only in B' : 'Only in A'}: ${esc(t.title)}</li>`, '') : ''}
      ${list('Much slower or faster (over 30% and 1 s)', [...slower, ...faster], ([ta, tb, d]) => `<li>${esc(tb.title)}: ${dur(ta.durationMs)} → ${dur(tb.durationMs)} <span class="${d > 0 ? 'c-crit' : 'c-good'}">(${d > 0 ? '+' : ''}${Math.round(d * 100)}%)</span></li>`, 'No test changed its time by more than 30% and 1 s.')}
      <!--tab key=api|label=API calls by API|badge=${epRows.length}--><section class="card" style="margin-bottom:40px"><div class="card-h"><h2>API calls by API</h2><div class="r">changed APIs first</div></div><div class="card-b tbl-wrap">${eps.length ? `<table><thead><tr><th>API</th><th class="num">Calls A</th><th class="num">Calls B</th><th>Status A</th><th>Status B</th><th class="num">Avg A</th><th class="num">Avg B</th><th>Change</th></tr></thead><tbody>${epRows.map((e) => `<tr class="${e.change ? 'chg' : ''}"><td class="mono" style="word-break:break-all">${esc(e.ep)}</td><td class="num">${e.x ? e.x.n : 0}</td><td class="num">${e.y ? e.y.n : 0}</td><td class="mono">${e.x ? statusList([...e.x.statuses]) : '—'}</td><td class="mono">${e.y ? statusList([...e.y.statuses]) : '—'}</td><td class="num">${avg(e.x) != null ? avg(e.x) + ' ms' : '—'}</td><td class="num">${avg(e.y) != null ? avg(e.y) + ' ms' : '—'}</td><td>${esc(e.change || 'same')}</td></tr>`).join('')}</tbody></table>` : `<div class="muted">Neither run has API calls. A: ${esc(noCallsReason(A, ra.tests))} B: ${esc(noCallsReason(B, rb.tests))}</div>`}</div></section><!--/tabs-->
    </div>`, 'numbers', 'Compare page');
  }

  // ---------------------------------------------------------------- 5. detail drawer
  const drawer = $('#drawer');
  let drawerToken = 0;
  function closeDrawer(silent) {
    document.body.classList.remove('drawer-open');
    if (!silent && S.open) setState({ open: '', t: '' });
  }
  function runDetailsDrawer(runId) {
    const r = idx.runs.find((x) => x.id === runId);
    if (!r) { drawer.innerHTML = '<div class="db"><p class="empty">Run not found.</p></div>'; document.body.classList.add('drawer-open'); return; }
    const d = r.details || {}, p = d.project || {}, ci = d.ci || null, t = d.tools || {}, h = d.host || {}, dev = r.device || {}, a = r.apk || {};
    const repo = repoOf(a);
    const row = (k, v) => (v === null || v === undefined || v === '' ? '' : `<dt>${k}</dt><dd>${v}</dd>`);

          <div class="muted" style="font-size:12px;margin-top:6px">${t.fails}/${t.n} of the last ${t.n} runs failed${t.flaky ? ' · flaky' : ''}. Newest first.</div></section>` },

  // "Copy link to this call": the address of the current view + run + call id
  function bindCallLinks(root) {
    $$('[data-copy-call]', root).forEach((b) => b.onclick = (e) => {
      e.preventDefault();
      const p = new URLSearchParams((location.hash.split('?')[1]) || '');
      p.set('call', b.dataset.copyCall); if (current) p.set('run', current.id);
      copyText(location.href.split('#')[0] + '#/' + S.tab + '?' + p, b);
    });
  }
  function revealCall(root) {

    if (el) { revealTabOf(el); el.open = true; el.scrollIntoView({ block: 'center' }); el.querySelector('summary').style.outline = '2px solid var(--accent)'; }
  }

  function bugReport(rec, run, g, lastPass) {

      `[${g.severity}] ${rec.title}`,
      `Status: ${g.st}${g.sinceRun ? ' since run ' + g.sinceRun : ''}${g.tests.length > 1 ? ` · same error in ${g.tests.length} tests: ${g.tests.map((t) => t.T.id || t.T.title).join(', ')}` : ''}`,
      `Module: ${g.modules.join(', ')}`,
      '',
      `App: ${a.application_id || '?'} ${verLabel(a)} (code ${a.version_code || '?'}) · build ${buildLabel(a)} ${a.build_id || ''} · commit ${a.commit || '?'}`,
      `Device: ${devName(d)}${d.apiLevel ? ' (API ' + d.apiLevel + ')' : ''}`,
      `Run: ${run.id} · test file ${rec.file || '?'} · ${dur(rec.durationMs)}`,
      '',
      'Steps to reproduce:',
      `1. Fresh install of build ${buildLabel(a)}, app data cleared`,
      ...(rec.steps || []).map((s, i) => `${i + 2}. ${s.text}`),
      '',
      rec.error ? `Error:\n${rec.error.message}` : '',
      rec.links?.length ? `Where: ${rec.links.map((l) => l.label).join(', ')}` : '',
      rec.warnings?.length ? `\nWarnings:\n${rec.warnings.map((w) => '- ' + w.message).join('\n')}` : '',
      rec.logcat?.errors?.length ? `\nApp log errors:\n${rec.logcat.errors.slice(-15).join('\n')}` : '',
      (rec.api || []).some((c) => ['fail', 'warn'].includes(callLevel(c)) || c.noResponse) ? `\nAPI problems:\n${(rec.api || []).filter((c) => ['fail', 'warn'].includes(callLevel(c)) || c.noResponse).map((c) => `- ${c.method} ${c.url}\n  ${c.resolution}`).join('\n')}` : '',
      lastPass ? `\nLast passed in run ${lastPass.runId}.` : '',
      rec.screenshot ? `Screenshot: reports/${rec.screenshot}` : '',
      rec.video ? `Video: reports/${rec.video}` : '',

  }
  function copyText(text, btn) {
    const done = () => { if (!btn) return; const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = o; }, 1500); };
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch {} ta.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  function whoAmI() {
    let me = store.get('egDashMe', '');

      const owners = allOwners();
      me = (prompt('Your name, as used for owners in test/triage.json' + (owners.length ? ' (' + owners.join(', ') + ')' : '') + ':', owners[0] || '') || '').trim();

  // ================================================================ SECONDARY TABS
  function coverageHtml() {
    const mods = idx.triage.modules || {};
    const byMod = new Map(Object.keys(mods).map((m) => [m, { m, tests: [], conf: mods[m] }]));
    for (const T of idx.tests) { if (!byMod.has(T.module)) byMod.set(T.module, { m: T.module, tests: [], conf: {} }); byMod.get(T.module).tests.push(T); }
    const list = [...byMod.values()];

        <div class="card card-b"><div class="muted">Tests tracked</div><div style="font-size:24px;font-weight:700">${idx.tests.length}</div><div class="muted" style="font-size:12px">${A ? A.tests.length + ' in the selected run' : ''}</div></div>
      </div>

      ${list.sort((a, b) => (a.tests.length ? 1 : 0) - (b.tests.length ? 1 : 0) || a.m.localeCompare(b.m)).map((x) => {

  function lineChart(runs, get, unit, color, label) {
    const vals = runs.map(get);
    const have = vals.filter((v) => v != null);
    if (!have.length) return '<p class="empty" style="padding:16px">No data yet.</p>';
    const W = 420, H = 130, L = 40, R = 10, T = 10, B = 22; const iw = W - L - R, ih = H - T - B;
    const max = Math.max(...have) * 1.15 || 1; const step = iw / Math.max(runs.length - 1, 1);
    const xy = (v, i) => [L + step * i, T + ih - (v / max) * ih];
    const pts = vals.map((v, i) => (v == null ? null : xy(v, i))).filter(Boolean);
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
      <line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="var(--border)"/><text x="${L - 4}" y="${T + 8}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(max)}${unit}</text>
      ${pts.length > 1 ? `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2"/>` : ''}
      ${vals.map((v, i) => (v == null ? '' : `<circle cx="${xy(v, i)[0]}" cy="${xy(v, i)[1]}" r="3.5" fill="${color}" class="hit" data-run="${esc(runs[i].id)}" data-tip="${esc(runs[i].id + ' · ' + axisLabel(runs[i]) + ' · ' + v + unit)}"/>`)).join('')}
      ${runs.map((r, i) => (i % Math.ceil(runs.length / 7) === 0 || i === runs.length - 1 ? `<text x="${L + step * i}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(axisLabel(r))}</text>` : '')).join('')}
    </svg></div>`;
  }
  // ---------------------------------------------------------------- budgets (test/budgets.json), trends, response formats (test/api-formats.json)
  // Nearest-rank percentile, the same as test/support/report/budgets.js
  const pctl = (vals, p) => { const v = vals.filter((x) => x != null).sort((a, b) => a - b); return v.length ? v[Math.min(v.length - 1, Math.max(0, Math.ceil((p / 100) * v.length) - 1))] : null; };
  const fmtV = (v, unit) => (v == null ? '—' : unit === 'ms' ? (v >= 10000 ? (v / 1000).toFixed(1) + ' s' : Math.round(v) + ' ms') : v + ' ' + unit);
  function spark(vals, unit, limit, label) {
    const have = vals.filter((v) => v != null);
    if (have.length < 2) return '<span class="muted" style="font-size:11px">' + (have.length ? 'one run' : '—') + '</span>';
    const W = 96, H = 24, max = Math.max(...have, limit || 0) * 1.1 || 1, step = W / Math.max(vals.length - 1, 1);
    const y = (v) => H - 2 - (v / max) * (H - 4);
    const pts = vals.map((v, i) => (v == null ? null : `${(i * step).toFixed(1)},${y(v).toFixed(1)}`)).filter(Boolean).join(' ');
    const last = vals[vals.length - 1];
    return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label + ': ' + have.map((v) => fmtV(v, unit)).join(', '))}">${limit != null ? `<line x1="0" x2="${W}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--critical)" stroke-dasharray="3 2" stroke-width="1" opacity=".6"/>` : ''}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${last != null ? `<circle cx="${((vals.length - 1) * step).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.5" fill="var(--accent)"/>` : ''}</svg>`;
  }
  // Values of one budget key over runs (oldest first), from the run summaries in data/index.js
  function seriesOf(key, runs) {
    const [area, name, metric] = key.split('|');
    if (area === 'api') return runs.map((r) => (r.metrics && r.metrics.api[name] ? (metric === 'size' ? null : r.metrics.api[name].p95) : null));
    if (key === 'app|launch') return runs.map((r) => (r.metrics ? r.metrics.launchMs : null));
    if (key === 'app|memory') return runs.map((r) => (r.metrics ? r.metrics.memoryMb : null));
    if (key === 'app|jank') return runs.map((r) => (r.perf ? r.perf.jankyPct : null));
    if (area === 'test') { const T = idx.tests.find((x) => x.id === name); const by = new Map((T ? T.results : []).map((x) => [x.runId, x.durationMs])); return runs.map((r) => (by.has(r.id) ? by.get(r.id) : null)); }
    return [];
  }
  function budgetHtml(run, runs) {
    const b = run.budget;
    if (!b) return '<section class="card card-b" style="margin-bottom:12px">No budget data for this run: rebuild the dashboard (npm run dashboard) to check it against test/budgets.json.</section>';

    const shortName = (x) => (x.area === 'api' ? x.name.replace(/^\S+ /, '') : x.name);
    const rows = b.items.map((x) => {
      const t = trendOf.get(x.key);

      const rank = st[1] === 'over budget' ? 0 : st[1] === 'slower than usual' ? 1 : st[0] === 'KNOWN' ? 3 : 2;

    }).sort((a, b2) => a.rank - b2.rank || (a.x.area === b2.x.area ? 0 : a.x.area === 'app' ? -1 : b2.x.area === 'app' ? 1 : a.x.area === 'api' ? -1 : 1));
    const over = rows.filter((r) => r.st[1] === 'over budget').length, slower = rows.filter((r) => r.st[1] === 'slower than usual').length + b.trends.filter((t) => t.slower && !t.known && !b.items.some((x) => x.key === t.key)).length;
    const fChecked = b.formats.reduce((n, f) => n + f.ok + f.problems, 0), fProb = b.formats.reduce((n, f) => n + f.problems, 0), fNot = b.formats.reduce((n, f) => n + f.notChecked, 0);
