# =====================================================================================
#  Compile the Wikipedia app from its repository, then run the smoke suite on an emulator.
#  Same idea as the eGenome workflow, plus step 1: the APK is BUILT here, not downloaded.
#
#  WHEN: every push / pull request to main, and the "Run workflow" button.
#  COST: free for public repositories. GitHub's Linux runners have KVM, so the emulator is fast.
#  NO SECRETS needed: the app repository is public and the smoke suite does not log in.
# =====================================================================================
name: Compile and smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'App branch, tag or full commit to build'
        default: 'HEAD'
      variant:
        description: 'Build variant'
        type: choice
        options: [devDebug, alphaDebug]
        default: devDebug

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      APP_REF: ${{ github.event.inputs.app_ref || 'HEAD' }}
      VARIANT: ${{ github.event.inputs.variant || 'devDebug' }}
      # Smaller Gradle footprint, so Gradle and the emulator fit together
      GRADLE_ARGS: -Dorg.gradle.jvmargs=-Xmx3g --max-workers=2

    steps:
      - name: Check out this test project
        uses: actions/checkout@v4

      # ---------- STEP 1: compile ----------
      - name: Set up Java 21 (Temurin, open source)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.VARIANT }}-v1

      - name: Compile the APK from the app repository
        run: bash scripts/build-apk.sh "$VARIANT"

      # ---------- STEP 2: test ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test libraries and the Appium Android driver
        run: |
          npm install --no-audit --no-fund
          npx appium driver install uiautomator2 || true

      - name: Enable hardware acceleration (KVM) for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator and run the smoke suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: npm run test:smoke

      - name: Keep the results, the receipt and the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run${{ github.run_number }}
          path: |
            reports/
            out/*.build-info.txt
            out/*.apk
          retention-days: 7
          if-no-files-found: ignore
